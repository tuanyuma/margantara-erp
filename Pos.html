<!-- =============================================================== -->
<!-- TAB: POS TRANSAKSI PENJUALAN BARU -->
<!-- =============================================================== -->
<section id="tab-pos" class="tab-content hidden space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
            <h2 class="text-base font-extrabold text-slate-900">Point of Sales (Kasir Baru)</h2>
            <p class="text-xs text-slate-500">Pilih outlet pelanggan, pilih produk pesanan, dan
                selesaikan pembayaran.</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-4">
            <div
                class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs flex flex-col gap-3">
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="flex-1 relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" id="pos-search-product" onkeyup="filterPOSProducts()"
                            placeholder="Cari nama produk / barcode / SKU..."
                            class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                    </div>
                    <select id="pos-outlet-select" onchange="handlePOSOutletChange()"
                        class="custom-select bg-slate-50 border border-slate-200 rounded-xl text-xs py-2 px-3 font-semibold text-slate-700">
                        <option value="">-- Pilih Outlet Pelanggan --</option>
                    </select>
                </div>
                <!-- Indikator Geofencing Radius Outlet untuk Transaksi POS -->
                <div id="pos-outlet-radius-badge" class="hidden text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2 transition-all"></div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3.5" id="pos-products-grid"></div>

            <!-- Pagination Controls POS Products -->
            <div
                class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between text-xs">
                <span id="pagination-info-pos-products" class="text-slate-500 font-medium">Menampilkan 0 produk</span>
                <div class="flex items-center gap-2">
                    <button id="btn-prev-pos-prod" onclick="changePOSProductPage(-1)"
                        class="px-3 py-1 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed font-bold rounded-lg text-slate-700 transition-colors">
                        <i class="fa-solid fa-chevron-left mr-1"></i> Prev
                    </button>
                    <button id="btn-next-pos-prod" onclick="changePOSProductPage(1)"
                        class="px-3 py-1 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed font-bold rounded-lg text-slate-700 transition-colors">
                        Next <i class="fa-solid fa-chevron-right ml-1"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right: Cart Summary -->
        <div
            class="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs flex flex-col h-fit sticky top-20">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="text-xs font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-indigo-600"></i>
                    <span>Keranjang Pesanan</span>
                </h3>
                <button onclick="clearCart()"
                    class="text-[11px] text-rose-500 hover:underline">Kosongkan</button>
            </div>

            <div id="cart-items-list"
                class="py-3 space-y-2.5 max-h-64 overflow-y-auto custom-scrollbar flex-1">
                <p class="text-xs text-slate-400 text-center py-6">Keranjang masih kosong.</p>
            </div>

            <div class="pt-3 border-t border-slate-100 space-y-2 text-xs">
                <div class="flex justify-between text-slate-500">
                    <span>Subtotal</span>
                    <span id="cart-subtotal" class="font-bold text-slate-900">Rp 0</span>
                </div>
                <div class="flex items-center justify-between text-slate-500">
                    <span>Diskon (Rp)</span>
                    <input type="number" id="cart-discount" oninput="renderCartSummary()" value="0"
                        min="0"
                        class="w-24 px-2 py-1 text-right bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold">
                </div>
                <div
                    class="flex justify-between text-slate-900 font-extrabold text-sm pt-2 border-t border-slate-100">
                    <span>Total Akhir</span>
                    <span id="cart-total-akhir" class="text-indigo-600">Rp 0</span>
                </div>
            </div>

            <!-- Peringatan jika di luar radius geofencing -->
            <div id="pos-radius-warning-box" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-2xl text-[11px] text-rose-700 font-bold flex items-center gap-2 mt-3">
                <i class="fa-solid fa-triangle-exclamation text-rose-600 text-sm shrink-0"></i>
                <span id="pos-radius-warning-text">Anda berada di luar radius toko. Transaksi POS dinonaktifkan!</span>
            </div>

            <button onclick="openModalPaymentCheckout()" id="btn-checkout-pos" disabled
                class="w-full mt-4 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold rounded-2xl text-xs shadow-md shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all">
                <i class="fa-solid fa-arrow-right"></i>
                <span>Lanjut Pembayaran</span>
            </button>
        </div>
    </div>
</section>
