        /**
         * Robust Number Parser for Google Sheets Data
         * Handles raw numbers, strings with 'Rp', dots/commas, decimals, negatives, etc.
         */
        function parseSafeNumber(val) {
            if (val === null || val === undefined || val === '') return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            var str = String(val).trim();
            if (!str || str === '-' || str === 'null' || str === 'undefined') return 0;
            var isNegative = str.indexOf('-') !== -1 || (str.startsWith('(') && str.endsWith(')'));
            var cleaned = str.replace(/[^\d.,]/g, '');
            if (!cleaned) return 0;

            var lastDot = cleaned.lastIndexOf('.');
            var lastComma = cleaned.lastIndexOf(',');

            if (lastDot !== -1 && lastComma !== -1) {
                if (lastDot > lastComma) {
                    cleaned = cleaned.replace(/,/g, '');
                } else {
                    cleaned = cleaned.replace(/\./g, '').replace(/,/g, '.');
                }
            } else if (lastComma !== -1) {
                var parts = cleaned.split(',');
                if (parts.length > 2) {
                    cleaned = cleaned.replace(/,/g, '');
                } else if (parts[1] && parts[1].length === 3) {
                    cleaned = cleaned.replace(/,/g, '');
                } else {
                    cleaned = cleaned.replace(/,/g, '.');
                }
            } else if (lastDot !== -1) {
                var dotParts = cleaned.split('.');
                if (dotParts.length > 2) {
                    cleaned = cleaned.replace(/\./g, '');
                } else if (dotParts[1] && dotParts[1].length === 3) {
                    cleaned = cleaned.replace(/\./g, '');
                }
            }

            var num = parseFloat(cleaned);
            if (isNaN(num)) return 0;
            return isNegative ? -num : num;
        }

        /**
         * Robust Coordinate Parser (Latitude / Longitude)
         */
        function parseSafeCoordinate(val, fallback) {
            if (val === null || val === undefined || val === '') return (fallback || 0);
            if (typeof val === 'number') return isNaN(val) ? (fallback || 0) : val;
            var s = String(val).trim().replace(',', '.');
            var n = parseFloat(s);
            return isNaN(n) ? (fallback || 0) : n;
        }

        /**
         * HTML Escaper & Null-Safe Text
         */
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function safeText(str, fallback) {
            if (str === null || str === undefined || String(str).trim() === '' || String(str).trim() === 'null' || String(str).trim() === 'undefined') {
                return fallback !== undefined ? fallback : '-';
            }
            return String(str).trim();
        }

        function formatRupiah(num) {
            var n = parseSafeNumber(num);
            return 'Rp ' + Math.round(n).toLocaleString('id-ID');
        }

        /**
         * Konversi Link Google Drive ke Google CDN lh3 Berkecepatan Tinggi
         */
        function formatDriveToLh3Url(url, fallback) {
            if (!url || typeof url !== 'string' || url.trim() === '' || url.trim() === '-') {
                return fallback || '';
            }
            if (url.indexOf('lh3.googleusercontent.com') !== -1) return url;

            var match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return 'https://lh3.googleusercontent.com/d/' + match[1];
            }
            return url;
        }

        /**
         * Pembersih & Formatter Jam (Anti Bug Tahun 1899-12-30 bawaan Spreadsheet)
         */
        function formatTime(val) {
            if (!val || val === '-' || val === 'null' || val === 'undefined') return '-';
            var str = String(val).trim();
            if (str.indexOf('1899-12-30') !== -1 || str.indexOf('1899-12-31') !== -1) {
                str = str.replace(/1899-12-3[01][T ]?/, '').trim();
            }
            if (str.indexOf('T') !== -1) {
                var parts = str.split('T');
                if (parts.length > 1) str = parts[1].substring(0, 8);
            }
            var matchTime = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
            if (matchTime) {
                var h = matchTime[1].padStart(2, '0');
                var m = matchTime[2];
                return h + ':' + m;
            }
            return str || '-';
        }

        /**
         * Normalisasi string/object tanggal menjadi format 'yyyy-MM-dd'
         */
        function normalizeDateStr(val) {
            if (!val || val === '-' || val === 'null' || val === 'undefined') return '';
            if (val instanceof Date) {
                var y = val.getFullYear();
                var m = String(val.getMonth() + 1).padStart(2, '0');
                var d = String(val.getDate()).padStart(2, '0');
                return y + '-' + m + '-' + d;
            }
            var s = String(val).trim();
            if (s.indexOf('1899-12-30') !== -1 || s.indexOf('1899-12-31') !== -1) return '';
            if (s.indexOf('T') !== -1) s = s.split('T')[0];
            if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
            var ddmmyyyy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
            if (ddmmyyyy) {
                var day = String(ddmmyyyy[1]).padStart(2, '0');
                var month = String(ddmmyyyy[2]).padStart(2, '0');
                var year = ddmmyyyy[3];
                return year + '-' + month + '-' + day;
            }
            var parsed = new Date(s);
            if (!isNaN(parsed.getTime()) && parsed.getFullYear() > 1970) {
                var py = parsed.getFullYear();
                var pm = String(parsed.getMonth() + 1).padStart(2, '0');
                var pd = String(parsed.getDate()).padStart(2, '0');
                return py + '-' + pm + '-' + pd;
            }
            return s.length >= 10 ? s.substring(0, 10) : s;
        }

        /**
         * Pembersih Tanggal (Format yyyy-MM-dd)
         */
        function formatDate(val) {
            var n = normalizeDateStr(val);
            return n || '-';
        }

        function getTodayDateString() {
            var now = new Date();
            var y = now.getFullYear();
            var m = String(now.getMonth() + 1).padStart(2, '0');
            var d = String(now.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        /**
         * Pengecekan Apakah Outlet Sudah Dilakukan Check-In Kunjungan Hari Ini
         */
        function isOutletCheckedInToday(outletCode, salesId) {
            if (!outletCode) return false;
            // Admin atau Owner selalu diizinkan jika sedang menguji sistem
            if (AppState.currentUser && (AppState.currentUser.role === 'Admin' || AppState.currentUser.role === 'Owner')) {
                return true;
            }
            if (!AppState.kunjungan || AppState.kunjungan.length === 0) return false;
            var todayStr = getTodayDateString();
            var targetCode = String(outletCode).trim().toUpperCase();
            var sId = salesId || (AppState.currentUser ? (AppState.currentUser.userId || AppState.currentUser.id || '') : '');
            
            return AppState.kunjungan.some(function (k) {
                var kSales = String(k['ID Sales'] || k.salesId || '').trim();
                var kOutlet = String(k['Kode Outlet'] || k.kodeOutlet || '').trim().toUpperCase();
                var kDate = normalizeDateStr(k['Tanggal'] || k.tanggal);
                var isValidSales = !sId || !kSales || kSales.toUpperCase() === String(sId).trim().toUpperCase();
                return isValidSales && kOutlet === targetCode && kDate === todayStr;
            });
        }

        /**
         * Pembersih Tanggal + Jam Gabungan
         */
        function formatDateTime(dateVal, timeVal) {
            if (!dateVal && !timeVal) return '-';
            if (dateVal && !timeVal) {
                if (dateVal instanceof Date) {
                    return formatDate(dateVal) + ' ' + formatTime(dateVal);
                }
                var s = String(dateVal).trim();
                if (s.indexOf(' ') !== -1 || s.indexOf('T') !== -1) {
                    var parts = s.replace('T', ' ').split(' ');
                    var dPart = formatDate(parts[0]);
                    var tPart = formatTime(parts[1]);
                    if (dPart !== '-' && tPart !== '-') return dPart + ' ' + tPart;
                    if (dPart !== '-') return dPart;
                }
                return formatDate(s);
            }
            var t = formatTime(timeVal);
            var d = formatDate(dateVal);
            if (d !== '-' && t !== '-') return d + ' ' + t;
            if (t !== '-') return t;
            return d;
        }

        /**
         * Client-Side Image Compressor (Canvas Resizing ke Max 1024px & JPEG 0.7)
         * Mengubah foto kamera HP 10MB menjadi ~150KB untuk upload instan & anti-timeout
         */
        function compressImageFile(file, maxWidth, maxHeight, quality, callback) {
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var width = img.width;
                    var height = img.height;

                    maxWidth = maxWidth || 720;
                    maxHeight = maxHeight || 720;
                    quality = quality || 0.55;

                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    var compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                    if (typeof callback === 'function') callback(compressedBase64);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        /**

         */
        function handleMapsLinkInput(url) {
            if (!url) return;
            var match1 = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match2 = url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match3 = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
            var match4 = url.match(/query=(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match5 = url.match(/center=(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match6 = url.match(/^(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)$/);

        /**
         * =========================================================================
         * LEAFLET INTERACTIVE MAP CONTROLLERS (OUTLET, KANTOR & PETA RUTE)
         * =========================================================================
         */
        function initOutletLeafletMap(lat, lng, radius) {
            setTimeout(function () {
                var latNum = Number(lat) || AppState.currentLat || -7.265432;
                var lngNum = Number(lng) || AppState.currentLong || 112.748901;
                var radNum = Number(radius) || 50;

                var container = document.getElementById('outlet-map-container');
                if (!container || typeof L === 'undefined') return;

                if (!AppState.leafletMaps.outlet) {
                    AppState.leafletMaps.outlet = L.map('outlet-map-container', {
                        zoomControl: true,
                        attributionControl: false
                    }).setView([latNum, lngNum], 16);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19
                    }).addTo(AppState.leafletMaps.outlet);

                    var marker = L.marker([latNum, lngNum], { draggable: true }).addTo(AppState.leafletMaps.outlet);
                    var circle = L.circle([latNum, lngNum], { radius: radNum, color: '#4f46e5', fillColor: '#6366f1', fillOpacity: 0.2 }).addTo(AppState.leafletMaps.outlet);

                    marker.on('dragend', function (e) {
                        var pos = e.target.getLatLng();
                        updateOutletCoordsInputs(pos.lat, pos.lng);
                        circle.setLatLng(pos);
                    });

                    AppState.leafletMaps.outlet.on('click', function (e) {
                        marker.setLatLng(e.latlng);
                        circle.setLatLng(e.latlng);
                        updateOutletCoordsInputs(e.latlng.lat, e.latlng.lng);
                    });

                    AppState.leafletMaps.outletMarker = marker;
                    AppState.leafletMaps.outletCircle = circle;
                } else {
                    AppState.leafletMaps.outlet.invalidateSize();
                    AppState.leafletMaps.outlet.setView([latNum, lngNum], 16);
                    if (AppState.leafletMaps.outletMarker) AppState.leafletMaps.outletMarker.setLatLng([latNum, lngNum]);
                    if (AppState.leafletMaps.outletCircle) {
                        AppState.leafletMaps.outletCircle.setLatLng([latNum, lngNum]);
                        AppState.leafletMaps.outletCircle.setRadius(radNum);
                    }
                }
            }, 250);
        }

        function updateOutletCoordsInputs(lat, lng) {
            var latEl = document.getElementById('outlet-lat');
            var lngEl = document.getElementById('outlet-long');
            if (latEl) latEl.value = Number(lat).toFixed(6);
            if (lngEl) lngEl.value = Number(lng).toFixed(6);
        }

        function lockGPSForOutletMap() {
            showToast('info', 'Mencari sinyal GPS akurat...');
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function (pos) {
                        AppState.currentLat = pos.coords.latitude;
                        AppState.currentLong = pos.coords.longitude;
                        updateOutletCoordsInputs(pos.coords.latitude, pos.coords.longitude);
                        if (AppState.leafletMaps.outlet) {
                            AppState.leafletMaps.outlet.flyTo([pos.coords.latitude, pos.coords.longitude], 17);
                            if (AppState.leafletMaps.outletMarker) AppState.leafletMaps.outletMarker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
                            if (AppState.leafletMaps.outletCircle) AppState.leafletMaps.outletCircle.setLatLng([pos.coords.latitude, pos.coords.longitude]);
                        }
                        var acc = Math.round(pos.coords.accuracy || 10);
                        showToast('success', 'Titik GPS berhasil dikunci! (Akurasi ' + acc + 'm)');
                    },
                    function (err) {
                        showToast('warning', 'GPS: ' + err.message + '. Menggunakan posisi terakhir.');
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                showToast('error', 'Browser tidak mendukung Geolocation.');
            }
        }

        function parseVisitDate(str) {
            if (!str) return null;
            if (str instanceof Date) return str;
            var s = String(str).trim().substring(0, 10);
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
                var p = s.split('-');
                return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
            }
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) {
                var p2 = s.split('/');
                return new Date(parseInt(p2[2], 10), parseInt(p2[1], 10) - 1, parseInt(p2[0], 10));
            }
            var d = new Date(s);
            return isNaN(d.getTime()) ? null : d;
        }

        function getOutletVisitStatus(kodeOutlet, statusVerifikasi) {
            var statusVerif = String(statusVerifikasi || '').trim().toLowerCase();
            var isPending = (statusVerif === 'pending' || statusVerif === 'belum diverifikasi');
            if (isPending) {
                return {
                    status: 'Pending',
                    colorClass: 'bg-rose-500',
                    pinBorder: 'border-rose-200',
                    badgeBg: 'bg-rose-100 text-rose-700 border-rose-200',
                    label: 'Pending (Belum Diverifikasi)',
                    isVisited7Days: false,
                    daysAgo: -1
                };
            }

            var targetCode = String(kodeOutlet || '').trim().toLowerCase();
            var visits = (AppState.kunjungan || []).filter(function (k) {
                return String(k['Kode Outlet'] || '').trim().toLowerCase() === targetCode;
            });

            var latestDateObj = null;
            var latestDateStr = '';
            if (visits.length > 0) {
                visits.forEach(function (v) {
                    var dStr = String(v['Tanggal'] || v['Tanggal Dibuat'] || '');
                    var dObj = parseVisitDate(dStr);
                    if (dObj) {
                        if (!latestDateObj || dObj.getTime() > latestDateObj.getTime()) {
                            latestDateObj = dObj;
                            latestDateStr = dStr;
                        }
                    }
                });
            }

            var isVisited7Days = false;
            var daysAgo = -1;
            if (latestDateObj) {
                var now = new Date();
                var todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                var vMidnight = new Date(latestDateObj.getFullYear(), latestDateObj.getMonth(), latestDateObj.getDate()).getTime();
                var diffMs = todayMidnight - vMidnight;
                daysAgo = Math.floor(diffMs / (24 * 60 * 60 * 1000));
                if (daysAgo >= 0 && daysAgo <= 7) {
                    isVisited7Days = true;
                }
            }

            if (isVisited7Days) {
                return {
                    status: 'Visited',
                    colorClass: 'bg-emerald-500',
                    pinBorder: 'border-emerald-200',
                    badgeBg: 'bg-emerald-100 text-emerald-700 border-emerald-200',
                    label: 'Sudah Dikunjungi (' + (daysAgo === 0 ? 'Hari Ini' : daysAgo + ' hari lalu') + ')',
                    isVisited7Days: true,
                    daysAgo: daysAgo
                };
            } else {
                return {
                    status: 'Verified',
                    colorClass: 'bg-amber-400',
                    pinBorder: 'border-amber-200',
                    badgeBg: 'bg-amber-100 text-amber-800 border-amber-200',
                    label: daysAgo > 7 ? 'Verified (Perlu Dikunjungi, ' + daysAgo + ' hari lalu)' : 'Verified (Belum Dikunjungi)',
                    isVisited7Days: false,
                    daysAgo: daysAgo
                };
            }
        }

        function renderRouteMap() {
            var container = document.getElementById('route-map-container');
            if (!container || typeof L === 'undefined') return;

            var subtitle = document.getElementById('route-map-subtitle');
            var filteredOutlets = AppState.outlet || [];

            // Filter outlet berdasarkan wilayah sales (jika user adalah sales)
            var userRole = (AppState.currentUser && AppState.currentUser.role) ? AppState.currentUser.role : '';
            var userWil = (AppState.currentUser && AppState.currentUser.kodeWilayah) ? String(AppState.currentUser.kodeWilayah).trim() : '';
            if (userRole === 'Sales' && userWil && userWil !== 'SEMUA') {
                filteredOutlets = filteredOutlets.filter(function (o) {
                    return String(o['Kode Wilayah'] || '').trim().toUpperCase() === userWil.toUpperCase();
                });
            }

            // Saring outlet yang memiliki koordinat GPS valid
            var validOutlets = filteredOutlets.filter(function (o) {
                var oLat = parseSafeCoordinate(o['Latitude'], 0);
                var oLng = parseSafeCoordinate(o['Longitude'], 0);
                return !(oLat === 0 && oLng === 0);
            });
            var totalValid = validOutlets.length;

            if (subtitle) {
                subtitle.innerText = 'Peta sebaran seluruh ' + totalValid.toLocaleString('id-ID') + ' titik outlet terdaftar';
            }

            try {
                if (!AppState.leafletMaps.route) {
                    var initLat = AppState.hasRealGPS ? AppState.currentLat : -8.650000;
                    var initLng = AppState.hasRealGPS ? AppState.currentLong : 116.320000;
                    AppState.leafletMaps.route = L.map('route-map-container', {
                        attributionControl: false,
                        preferCanvas: true
                    }).setView([initLat, initLng], 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(AppState.leafletMaps.route);
                } else {
                    AppState.leafletMaps.route.invalidateSize();
                    if (AppState.leafletMaps.routeCluster) {
                        AppState.leafletMaps.routeCluster.clearLayers();
                    }
                    if (AppState.leafletMaps.routeLayer) {
                        AppState.leafletMaps.routeLayer.clearLayers();
                    }
                }

                // Inisialisasi MarkerClusterGroup dengan chunkedLoading agar seluruh titik dimuat halus di background
                if (!AppState.leafletMaps.routeCluster && typeof L.markerClusterGroup === 'function') {
                    AppState.leafletMaps.routeCluster = L.markerClusterGroup({
                        chunkedLoading: true,
                        chunkInterval: 50,
                        chunkDelay: 10,
                        maxClusterRadius: 60,
                        spiderfyOnMaxZoom: true,
                        showCoverageOnHover: false,
                        zoomToBoundsOnClick: true,
                        disableClusteringAtZoom: 17,
                        animate: true
                    });
                    AppState.leafletMaps.route.addLayer(AppState.leafletMaps.routeCluster);
                } else if (!AppState.leafletMaps.routeLayer) {
                    AppState.leafletMaps.routeLayer = L.layerGroup().addTo(AppState.leafletMaps.route);
                }

                var markerTarget = AppState.leafletMaps.routeCluster || AppState.leafletMaps.routeLayer;
                markerTarget.clearLayers();
                var bounds = [];

                // User location pin (HANYA jika ada koordinat GPS nyata)
                if (AppState.hasRealGPS && AppState.currentLat && AppState.currentLong) {
                    var userIcon = L.divIcon({
                        className: 'custom-user-pin',
                        html: '<div class="w-6 h-6 rounded-full bg-indigo-600 border-2 border-white shadow-lg flex items-center justify-center text-white text-[10px]"><i class="fa-solid fa-user"></i></div>',
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });
                    L.marker([AppState.currentLat, AppState.currentLong], { icon: userIcon })
                        .bindPopup('<b>Posisi Anda Saat Ini</b>')
                        .addTo(AppState.leafletMaps.route);
                    bounds.push([AppState.currentLat, AppState.currentLong]);
                }

                // Pre-index kunjungan 7 hari terakhir ke Set O(1) agar looping 7.805 outlet seketika (<2 milidetik)
                var visited7DaysSet = new Set();
                var nowTime = Date.now();
                var sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
                (AppState.kunjungan || []).forEach(function (k) {
                    var dObj = parseVisitDate(k['Tanggal'] || k['Tanggal Dibuat'] || '');
                    if (dObj && (nowTime - dObj.getTime()) <= sevenDaysMs) {
                        var oc = String(k['Kode Outlet'] || '').trim().toUpperCase();
                        if (oc) visited7DaysSet.add(oc);
                    }
                });

                // 3 Objek Icon Reusable (Menghemat 95% memori DOM browser HP)
                var iconGreen = L.divIcon({
                    className: 'custom-outlet-pin-visited',
                    html: '<div class="w-6 h-6 rounded-full bg-emerald-600 border-2 border-white shadow-md flex items-center justify-center text-white text-[10px]"><i class="fa-solid fa-store"></i></div>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
                var iconYellow = L.divIcon({
                    className: 'custom-outlet-pin-verified',
                    html: '<div class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white shadow-md flex items-center justify-center text-white text-[10px]"><i class="fa-solid fa-store"></i></div>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
                var iconRed = L.divIcon({
                    className: 'custom-outlet-pin-pending',
                    html: '<div class="w-6 h-6 rounded-full bg-rose-500 border-2 border-white shadow-md flex items-center justify-center text-white text-[10px]"><i class="fa-solid fa-store"></i></div>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                // Pembuatan marker secara massal (Bulk Array) untuk efisiensi k-d tree cluster
                var markerList = [];
                validOutlets.forEach(function (o) {
                    var oLat = parseSafeCoordinate(o['Latitude'], 0);
                    var oLng = parseSafeCoordinate(o['Longitude'], 0);
                    if (oLat === 0 && oLng === 0) return;

                    var sVerif = String(o['Status Verifikasi'] || '').trim().toLowerCase();
                    var isPending = (sVerif === 'pending' || sVerif === 'belum diverifikasi');
                    var isVisited = visited7DaysSet.has(String(o['Kode Outlet'] || '').trim().toUpperCase());

                    var pinIcon = isPending ? iconRed : (isVisited ? iconGreen : iconYellow);
                    var m = L.marker([oLat, oLng], { icon: pinIcon });

                    // Lazy Popup: Hanya dibuat saat marker diklik (menghemat megabytes memori)
                    m.bindPopup(function () {
                        var vLabel = isPending ? 'Pending (Belum Diverifikasi)' : (isVisited ? 'Sudah Dikunjungi ≤ 7 Hari' : 'Verified / Belum Dikunjungi');
                        var vBadge = isPending ? 'bg-rose-100 text-rose-700 border-rose-200' : (isVisited ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-amber-100 text-amber-700 border-amber-200');
                        return '<div class="text-xs p-1 space-y-1">' +
                            '<h4 class="font-bold text-slate-900">' + (o['Nama Toko'] || '-') + '</h4>' +
                            '<span class="inline-block px-2 py-0.5 rounded-md text-[10px] font-bold border ' + vBadge + '">' + vLabel + '</span>' +
                            '<p class="text-slate-500 text-[11px]">' + (o['Alamat'] || '-') + '</p>' +
                            '<p class="text-indigo-600 font-semibold text-[10px]">Jadwal: ' + (o['Hari Kunjungan'] || 'Setiap Hari') + '</p>' +
                            '<button onclick="openModalKunjunganCheckin(\'' + o['Kode Outlet'] + '\')" class="w-full mt-1.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-[11px] flex items-center justify-center gap-1 shadow-sm"><i class="fa-solid fa-camera"></i> Check-in Toko</button>' +
                            '</div>';
                    });

                    markerList.push(m);
                    bounds.push([oLat, oLng]);
                });

                // Masukkan seluruh marker secara massal (addLayers)
                if (AppState.leafletMaps.routeCluster && typeof AppState.leafletMaps.routeCluster.addLayers === 'function') {
                    AppState.leafletMaps.routeCluster.addLayers(markerList);
                } else {
                    markerList.forEach(function (m) { markerTarget.addLayer(m); });
                }

                if (bounds.length > 1) {
                    AppState.leafletMaps.route.fitBounds(bounds, { padding: [25, 25], maxZoom: 16 });
                } else if (bounds.length === 1) {
                    AppState.leafletMaps.route.setView(bounds[0], 15);
                } else {
                    AppState.leafletMaps.route.setView([-8.650000, 116.320000], 12);
                }
            } catch (err) {
                console.error('Error rendering route map:', err);
                showToast('warning', 'Peta dimuat dalam mode cadangan.');
            }
        }

        function handleLogin(e) {
            if (e) e.preventDefault();

            var p = document.getElementById('login-password').value || '';

            showLoading('Memverifikasi akun...');

            if (typeof google !== 'undefined' && google.script && google.script.run) {

                    .withSuccessHandler(function (res) {

                            if (window.AndroidBridge && typeof window.AndroidBridge.subscribeUserTopic === 'function') {

                            loadInitialData();
                        } else {

                        }

                    .withFailureHandler(function (err) {
                        hideLoading();
                        showToast('error', err.message || 'Gagal terhubung.');

                    .apiCall('login', { username: u, password: p });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            var R = 6371e3;
            var phi1 = (lat1 * Math.PI) / 180;
            var phi2 = (lat2 * Math.PI) / 180;
            var deltaPhi = ((lat2 - lat1) * Math.PI) / 180;
            var deltaLambda = ((lon2 - lon1) * Math.PI) / 180;
            var a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function loadInitialData() {
            // Instant Cache Hydration for Sub-Second Initial Render
            try {
                var cachedRaw = sessionStorage.getItem('tokotrack_cached_initial_data');
                if (cachedRaw) {
                    var cached = JSON.parse(cachedRaw);
                    if (cached && cached.success) {
                        AppState.config = cached.config || AppState.config;
                        AppState.wilayah = cached.wilayah || [];
                        AppState.produk = cached.produk || [];
                        AppState.outlet = cached.outlet || [];
                        AppState.kunjungan = cached.kunjungan || [];
                        AppState.users = cached.users || [];
                        applyBranding();
                        applyRolePermissions();
                        renderAllModules();
                    }
                }
            } catch (e) { /* ignore cache read error */ }

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (res && res.success) {
                            try {
                                sessionStorage.setItem('tokotrack_cached_initial_data', JSON.stringify(res));
                            } catch (e) { /* quota fallback */ }

                            AppState.config = res.config || AppState.config;
                            AppState.wilayah = res.wilayah || [];
                            AppState.produk = res.produk || [];
                            AppState.outlet = res.outlet || [];
                            AppState.kunjungan = res.kunjungan || [];
                            AppState.users = res.users || [];
                            applyBranding();
                            applyRolePermissions();
                            renderAllModules();
                            syncUserPushNotificationTopic();
                            loadDashboardData();
                            // Riwayat transaksi dimuat secara lazy saat tab Riwayat dibuka agar refresh awal super cepat
                            setTimeout(function () {
                                loadActivityNotifications();
                            }, 2500);
                        } else {
                            handleInitialDataFailure('Gagal memuat data dari database Google Sheets.');
                        }
                    })
                    .withFailureHandler(function (err) {
                        handleInitialDataFailure('Gagal terhubung ke Google Sheets: ' + (err && err.message ? err.message : 'Koneksi error'));
                    })
                    .apiCall('getInitialData', {
                        userId: AppState.currentUser ? AppState.currentUser.userId : 'USR-001',
                        role: AppState.currentUser ? AppState.currentUser.role : 'Sales',
                        kodeWilayah: AppState.currentUser ? AppState.currentUser.kodeWilayah : 'SBY'

                handleInitialDataFailure('Koneksi Google Sheets tidak tersedia.');
            }

        function populateDashboardSalesFilter(targetWilayah) {

                return r === 'sales' && st === 'aktif';
            });

            var wil = targetWilayah || AppState.dashboardWilayahFilter || 'SEMUA';
            if (wil && wil !== 'SEMUA') {
                var filtered = salesList.filter(function (u) {
                    var uWil = String(u['Kode Wilayah'] || u.kodeWilayah || '').trim().toLowerCase();
                    var tWil = wil.trim().toLowerCase();
                    return uWil === tWil || uWil.indexOf(tWil) !== -1 || tWil.indexOf(uWil) !== -1;
                });
                if (filtered.length > 0) salesList = filtered;
            }

            var exists = false;
            salesList.forEach(function (s) {
                var sId = s['User ID'] || s.userId || '';
                var sName = s['Nama Lengkap'] || s.namaLengkap || sId;
                var sWil = s['Kode Wilayah'] || s.kodeWilayah || '';
                var label = sName + (sWil ? ' (' + sWil + ')' : '');
                if (sId === curVal) exists = true;

                var opt = document.createElement('option');
                opt.value = sId;
                opt.textContent = label;
                opt.style.cssText = 'color:#0f172a; background-color:#ffffff;';
                opt.className = 'text-slate-900 bg-white font-bold';
                select.appendChild(opt);
            });

            if (exists) {
                select.value = curVal;
            } else {
                select.value = 'SEMUA';
                AppState.dashboardSalesFilter = 'SEMUA';
            }
        }

            var btnNext = document.getElementById('btn-next-leaderboard');

            if (!container) return;

            if (!lbList || lbList.length === 0) {
                container.innerHTML = '<div class="py-8 text-center text-slate-400 text-xs font-medium">Belum ada perolehan transaksi sales.</div>';
                if (pInfo) pInfo.innerText = '0 / 0';
                if (badgePage) badgePage.innerText = '0 Sales';
                if (btnPrev) btnPrev.disabled = true;
                if (btnNext) btnNext.disabled = true;
                return;
            }

            var pageSize = (TableState.leaderboard && TableState.leaderboard.pageSize) || 5;
            var curPage = (TableState.leaderboard && TableState.leaderboard.page) || 1;
            var totalPages = Math.ceil(lbList.length / pageSize) || 1;

            if (curPage > totalPages) curPage = totalPages;
            if (curPage < 1) curPage = 1;
            if (TableState.leaderboard) TableState.leaderboard.page = curPage;

            var startIndex = (curPage - 1) * pageSize;
            var endIndex = Math.min(startIndex + pageSize, lbList.length);
            var pageItems = lbList.slice(startIndex, endIndex);

            if (badgePage) {
                badgePage.innerText = 'Peringkat ' + (startIndex + 1) + '-' + endIndex + ' (' + lbList.length + ')';
            }

            container.innerHTML = pageItems.map(function (s, idx) {
                var rank = startIndex + idx + 1;
                var rankBadgeClass = rank === 1 ? 'bg-amber-400 text-amber-950 font-black' :
                    rank === 2 ? 'bg-slate-300 text-slate-900 font-bold' :
                        rank === 3 ? 'bg-amber-600 text-white font-bold' : 'bg-slate-100 text-slate-600 font-bold';

                return '<div class="flex items-center justify-between text-xs p-1.5 rounded-2xl hover:bg-slate-50 transition-colors">' +
                    '<div class="flex items-center gap-2.5">' +
                    '<span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] shrink-0 ' + rankBadgeClass + '">' + rank + '</span>' +
                    '<div class="w-7 h-7 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-[11px] shrink-0 shadow-2xs">' + s.namaLengkap.charAt(0).toUpperCase() + '</div>' +
                    '<div class="min-w-0">' +
                    '<p class="font-bold text-slate-900 truncate leading-tight">' + s.namaLengkap + '</p>' +
                    '<p class="text-[10px] text-slate-400">Total omzet sales</p>' +
                    '</div>' +
                    '</div>' +
                    '<span class="font-extrabold text-slate-900 text-right shrink-0">' + formatRupiah(s.totalOmzet) + '</span>' +
                    '</div>';
            }).join('');

            if (pInfo) pInfo.innerText = curPage + ' / ' + totalPages;
            if (btnPrev) btnPrev.disabled = (curPage <= 1);
            if (btnNext) btnNext.disabled = (curPage >= totalPages);
        }

        function renderDashboardChart(dashboardData) {
            var ctx = document.getElementById('salesTrendChart');
            if (!ctx) return;
            if (AppState.salesChartInstance) AppState.salesChartInstance.destroy();

            var mode = AppState.dashboardChartMode || 'bar';
            var brandVol = (dashboardData && dashboardData.brandVolume) ? dashboardData.brandVolume : null;
            var weeklyTrend = (dashboardData && dashboardData.weeklyTrend) ? dashboardData.weeklyTrend : null;

            if (mode === 'bar') {
                var default12Labels = ['PsD', 'PsF', 'Age', 'ART', 'PsE', 'AAM', 'PsMI', 'PsMGO', 'PsPLR', 'PsWTM', 'PsAPL', 'KJJ'];
                var default12Names = ['Ps Djeram (PSK)', 'Ps Filter (PSF)', 'AGE', 'ARTI', 'Ps Exclusive (PSE)', 'Arti Apel Madu', 'Ps Mild', 'Ps Mangga', 'Ps Purple', 'Ps Watermelon', 'Ps Apel', 'Kujang Jaya'];
                var default12Values = [1347, 990, 1140, 740, 530, 260, 250, 1350, 680, 420, 710, 730];

                var labels = (brandVol && brandVol.labels && brandVol.labels.length > 0)
                    ? brandVol.labels
                    : default12Labels;
                var fullNames = (brandVol && brandVol.fullNames && brandVol.fullNames.length > 0)
                    ? brandVol.fullNames
                    : default12Names;
                var dataBks = (brandVol && brandVol.dataBks && brandVol.dataBks.length > 0)
                    ? brandVol.dataBks
                    : default12Values;

                var barColors = [
                    '#4f46e5', '#06b6d4', '#10b981', '#f59e0b', '#ef4444',
                    '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#64748b', '#84cc16', '#a855f7'
                ];

                AppState.salesChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Volume Terjual',
                            data: dataBks,
                            backgroundColor: labels.map(function (_, i) { return barColors[i % barColors.length]; }),
                            borderRadius: 6,
                            borderSkipped: false,
                            maxBarThickness: 26
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    title: function (context) {
                                        var idx = context[0].dataIndex;
                                        return (fullNames && fullNames[idx]) ? fullNames[idx] : context[0].label;
                                    },
                                    label: function (context) {
                                        var bks = context.parsed.y || 0;
                                        var ball = (bks / 200).toFixed(2);
                                        return ' ' + Number(bks).toLocaleString('id-ID') + ' Bks (~ ' + ball + ' Ball)';
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function (val) { return Number(val).toLocaleString('id-ID') + ' Bks'; },
                                    font: { size: 10, family: "'Plus Jakarta Sans', sans-serif" }
                                },
                                grid: { color: '#f1f5f9' }
                            },
                            x: {
                                ticks: {
                                    font: { size: 9, weight: 'bold', family: "'Plus Jakarta Sans', sans-serif" },
                                    maxRotation: 45,
                                    minRotation: 0,
                                    autoSkip: false
                                },
                                grid: { display: false }
                            }
                        }
                    }
                });
            } else {
                // Line Chart mode (7 days trend)
                var labels = (weeklyTrend && weeklyTrend.labels) ? weeklyTrend.labels : ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
                var datasets = [];

                if (weeklyTrend && weeklyTrend.datasets && weeklyTrend.datasets.length > 0) {
                    datasets = weeklyTrend.datasets;
                } else if (weeklyTrend && weeklyTrend.data) {
                    datasets = [{
                        label: 'Total Penjualan',
                        data: weeklyTrend.data,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        tension: 0.35,
                        borderWidth: 2.5,
                        fill: false
                    }];
                } else {
                    datasets = [{
                        label: 'Belum Ada Penjualan',
                        data: [0, 0, 0, 0, 0, 0, 0],
                        borderColor: '#94a3b8',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        fill: false
                    }];
                }

                AppState.salesChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                align: 'end',
                                labels: {
                                    boxWidth: 10,
                                    boxHeight: 10,
                                    usePointStyle: true,
                                    pointStyle: 'circle',
                                    font: { size: 10, weight: 'bold', family: "'Plus Jakarta Sans', sans-serif" }
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        var label = context.dataset.label || '';
                                        var val = context.parsed.y || 0;
                                        var ball = (val / 200).toFixed(2);
                                        return ' ' + label + ': ' + Number(val).toLocaleString('id-ID') + ' Bks (~ ' + ball + ' Ball)';
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function (value) { return Number(value).toLocaleString('id-ID') + ' Bks'; },
                                    font: { size: 10, family: "'Plus Jakarta Sans', sans-serif" }
                                },
                                grid: { color: '#f1f5f9' }
                            },
                            x: {
                                ticks: { font: { size: 10, family: "'Plus Jakarta Sans', sans-serif" } },
                                grid: { display: false }
                            }
                        }
                    }
                });
            }
        }

                        var oLng = Number(o['Longitude']) || 0;

                        return '<option value="' + o['Kode Outlet'] + '"' + (!isInside ? ' style="color:#e11d48;"' : '') + '>' + o['Nama Toko'] + ' (' + o['Kode Wilayah'] + ')' + distTag + '</option>';

                    salesUsers = salesUsers.filter(function (u) { return u['Kode Wilayah'] === AppState.currentUser.kodeWilayah; });

        function renderPOSProducts(products) {
            var grid = document.getElementById('pos-products-grid');
            var pInfo = document.getElementById('pagination-info-pos-products');
            var btnPrev = document.getElementById('btn-prev-pos-prod');
            var btnNext = document.getElementById('btn-next-pos-prod');
            if (!grid) return;

            var prodList = [].concat(products || AppState.produk || []);
            var st = TableState.posProducts || { search: '', page: 1, pageSize: 12 };

            if (st.search) {
                var q = st.search.toLowerCase();
                prodList = prodList.filter(function (p) {
                    return (p['Nama Produk'] || '').toLowerCase().indexOf(q) !== -1 ||
                        (p['Kode Produk'] || '').toLowerCase().indexOf(q) !== -1 ||
                        (p['Kategori'] || '').toLowerCase().indexOf(q) !== -1;
                });
            }

            var totalItems = prodList.length;
            var totalPages = Math.max(1, Math.ceil(totalItems / st.pageSize));
            if (st.page > totalPages) st.page = totalPages;
            if (st.page < 1) st.page = 1;

            var startIndex = (st.page - 1) * st.pageSize;
            var paginatedProducts = prodList.slice(startIndex, startIndex + st.pageSize);

            if (paginatedProducts.length === 0) {
                grid.innerHTML = '<div class="col-span-full bg-white p-6 rounded-2xl border border-slate-200 text-center text-slate-400 text-xs">Tidak ada produk yang cocok dengan pencarian.</div>';
            } else {
                grid.innerHTML = paginatedProducts.map(function (p) {
                    return '<div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs flex flex-col justify-between space-y-2">' +
                        '<div>' +
                        '<span class="text-[10px] font-bold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md">' + (p['Satuan'] || 'Pcs') + '</span>' +
                        '<h4 class="font-bold text-slate-900 text-xs mt-1.5 line-clamp-2">' + p['Nama Produk'] + '</h4>' +
                        '<p class="text-xs font-extrabold text-indigo-600 mt-1">' + formatRupiah(p['Harga Jual']) + '</p>' +
                        '</div>' +
                        '<button onclick="addToCart(\'' + p['Kode Produk'] + '\')" class="w-full py-1.5 bg-indigo-50 hover:bg-indigo-600 hover:text-white text-indigo-600 font-bold rounded-xl text-xs transition-colors">' +
                        '+ Tambah' +
                        '</button>' +
                        '</div>';
                }).join('');
            }

            if (pInfo) pInfo.innerText = 'Menampilkan ' + (totalItems === 0 ? 0 : startIndex + 1) + ' - ' + Math.min(startIndex + st.pageSize, totalItems) + ' dari ' + totalItems + ' produk (Hal ' + st.page + '/' + totalPages + ')';
            if (btnPrev) btnPrev.disabled = st.page <= 1;
            if (btnNext) btnNext.disabled = st.page >= totalPages;
        }

        function filterPOSProducts() {
            var q = (document.getElementById('pos-search-product').value || '').trim();
            TableState.posProducts.search = q;
            TableState.posProducts.page = 1;
            renderPOSProducts(AppState.produk);
        }

        function changePOSProductPage(delta) {
            TableState.posProducts.page += delta;
            renderPOSProducts(AppState.produk);
        }

        function addToCart(kode) {
            var p = AppState.produk.find(function (item) { return item['Kode Produk'] === kode; });
            if (!p) return;
            var ex = AppState.cart.find(function (c) { return c.kodeProduk === kode; });
            if (ex) ex.qty += 1;
            else AppState.cart.push({ kodeProduk: p['Kode Produk'], namaProduk: p['Nama Produk'], harga: parseSafeNumber(p['Harga Jual']), satuan: p['Satuan'], qty: 1 });
            renderCart();
            showToast('info', 'Ditambahkan: ' + p['Nama Produk']);
        }

        function renderCart() {
            var el = document.getElementById('cart-items-list');
            if (!el) return;
            if (AppState.cart.length === 0) {
                el.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Keranjang masih kosong.</p>';
            } else {
                el.innerHTML = AppState.cart.map(function (c, idx) {
                    return '<div class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200/80 rounded-2xl text-xs gap-2">' +
                        '<div class="flex-1 min-w-0">' +
                        '<p class="font-bold text-slate-900 truncate">' + c.namaProduk + '</p>' +
                        '<p class="text-[11px] font-semibold text-slate-500 mt-0.5">' + formatRupiah(c.harga) + ' <span class="text-slate-400 font-normal">/' + (c.satuan || 'Pcs') + '</span></p>' +
                        '</div>' +
                        '<div class="flex items-center gap-1.5 shrink-0">' +
                        '<button type="button" onclick="changeCartItemQty(' + idx + ', -1)" class="w-7 h-7 bg-white hover:bg-slate-200 text-slate-700 font-bold border border-slate-300 rounded-lg flex items-center justify-center transition-all shadow-2xs">' +
                        '<i class="fa-solid fa-minus text-[10px]"></i>' +
                        '</button>' +
                        '<input type="number" min="1" value="' + c.qty + '" onchange="updateCartItemQty(' + idx + ', this.value)" class="w-12 h-7 bg-white border border-slate-300 rounded-lg text-center font-bold text-slate-900 text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none">' +
                        '<button type="button" onclick="changeCartItemQty(' + idx + ', 1)" class="w-7 h-7 bg-white hover:bg-indigo-50 text-indigo-600 font-bold border border-indigo-200 rounded-lg flex items-center justify-center transition-all shadow-2xs">' +
                        '<i class="fa-solid fa-plus text-[10px]"></i>' +
                        '</button>' +
                        '<button type="button" onclick="removeCartItem(' + idx + ')" class="p-1 text-slate-300 hover:text-rose-500 ml-0.5 transition-colors" title="Hapus item">' +
                        '<i class="fa-solid fa-trash text-xs"></i>' +
                        '</button>' +
                        '</div>' +
                        '</div>';
                }).join('');
            }
            renderCartSummary();
        }

        function changeCartItemQty(index, delta) {
            if (!AppState.cart[index]) return;
            AppState.cart[index].qty = Math.max(1, (Number(AppState.cart[index].qty) || 1) + delta);
            renderCart();
        }

        function updateCartItemQty(index, newQty) {
            if (!AppState.cart[index]) return;
            var val = parseInt(newQty, 10);
            if (isNaN(val) || val < 1) val = 1;
            AppState.cart[index].qty = val;
            renderCart();
        }

        function removeCartItem(index) {
            if (AppState.cart[index]) {
                AppState.cart.splice(index, 1);
                renderCart();
            }
        }

        function getCartTotals() {
            var sub = 0;
            AppState.cart.forEach(function (c) { sub += (parseSafeNumber(c.harga) * (Number(c.qty) || 1)); });
            var discInput = document.getElementById('cart-discount');
            var disc = discInput ? parseSafeNumber(discInput.value) : 0;
            var total = Math.max(0, sub - disc);
            return { subtotal: sub, diskon: disc, totalAkhir: total };
        }

        function renderCartSummary() {
            var t = getCartTotals();
            if (document.getElementById('cart-subtotal')) document.getElementById('cart-subtotal').innerText = formatRupiah(t.subtotal);
            if (document.getElementById('cart-total-akhir')) document.getElementById('cart-total-akhir').innerText = formatRupiah(t.totalAkhir);
            
            var btnCheckout = document.getElementById('btn-checkout-pos');
            if (btnCheckout) {
                var outletCode = document.getElementById('pos-outlet-select') ? document.getElementById('pos-outlet-select').value : '';
                var isRadiusValid = true;
                var isCheckinValid = true;
                if (outletCode) {
                    isCheckinValid = isOutletCheckedInToday(outletCode);
                    var targetOutlet = AppState.outlet.find(function (item) { return item['Kode Outlet'] === outletCode; });
                    if (targetOutlet) {
                        var oLat = Number(targetOutlet['Latitude']) || 0;
                        var oLng = Number(targetOutlet['Longitude']) || 0;
                        var hasCoords = (oLat !== 0 || oLng !== 0) && !isNaN(oLat) && !isNaN(oLng);
                        if (hasCoords) {
                            var dist = calculateDistance(AppState.currentLat, AppState.currentLong, oLat, oLng);
                            var maxRadius = Number(targetOutlet['Radius Meter']) || 50;
                            if (dist > maxRadius) {
                                isRadiusValid = false;
                            }
                        }
                    }
                } else {
                    isCheckinValid = false;
                }
                btnCheckout.disabled = (AppState.cart.length === 0 || !isRadiusValid || !isCheckinValid);
            }
        }

        function handlePOSOutletChange() {
            var select = document.getElementById('pos-outlet-select');
            var badge = document.getElementById('pos-outlet-radius-badge');
            var warnBox = document.getElementById('pos-radius-warning-box');
            var warnText = document.getElementById('pos-radius-warning-text');
            if (!select) return;

            var kode = select.value;
            if (!kode) {
                if (badge) { badge.className = 'hidden'; badge.innerHTML = ''; }
                if (warnBox) warnBox.classList.add('hidden');
                renderCartSummary();
                return;
            }

            var o = AppState.outlet.find(function (item) { return item['Kode Outlet'] === kode; });
            if (!o) {
                renderCartSummary();
                return;
            }

            var isCheckedIn = isOutletCheckedInToday(kode);
            var oLat = Number(o['Latitude']) || 0;
            var oLng = Number(o['Longitude']) || 0;
            var hasCoords = (oLat !== 0 || oLng !== 0) && !isNaN(oLat) && !isNaN(oLng);
            var maxRadius = Number(o['Radius Meter']) || 50;
            var dist = hasCoords ? calculateDistance(AppState.currentLat, AppState.currentLong, oLat, oLng) : 0;
            var isInside = !hasCoords || (dist <= maxRadius);

            if (badge) {
                badge.className = 'text-xs font-bold px-3 py-2 rounded-xl flex flex-col gap-1 transition-all border';
                var badgeInnerHtml = '';
                
                // Status Check-in Kunjungan
                if (isCheckedIn) {
                    badgeInnerHtml += '<div class="flex items-center gap-1.5 text-emerald-700 font-bold"><i class="fa-solid fa-clipboard-check text-emerald-600"></i><span>Status Kunjungan: Sudah Check-in Hari Ini</span></div>';
                } else {
                    badgeInnerHtml += '<div class="flex items-center gap-1.5 text-rose-700 font-extrabold"><i class="fa-solid fa-lock text-rose-600"></i><span>Status Kunjungan: BELUM Check-in Hari Ini (POS Terkunci)</span></div>';
                }

                // Status GPS Radius
                if (!hasCoords) {
                    badgeInnerHtml += '<div class="flex items-center gap-1.5 text-amber-700 text-[11px]"><i class="fa-solid fa-triangle-exclamation text-amber-500"></i><span>Titik GPS Toko Belum Disetel (Transaksi Diizinkan)</span></div>';
                } else if (isInside) {
                    badgeInnerHtml += '<div class="flex items-center gap-1.5 text-emerald-700 text-[11px]"><i class="fa-solid fa-circle-check text-emerald-500"></i><span>Jarak: ' + dist + 'm (Batas: ' + maxRadius + 'm) - Di Dalam Radius</span></div>';
                } else {
                    badgeInnerHtml += '<div class="flex items-center gap-1.5 text-rose-700 text-[11px]"><i class="fa-solid fa-circle-xmark text-rose-500"></i><span>Jarak: ' + dist + 'm (Batas: ' + maxRadius + 'm) - Di Luar Radius</span></div>';
                }

                if (!isCheckedIn || !isInside) {
                    badge.classList.add('bg-rose-50', 'border-rose-200');
                } else {
                    badge.classList.add('bg-emerald-50', 'border-emerald-200');
                }
                badge.innerHTML = badgeInnerHtml;
            }

            if (warnBox) {
                if (!isCheckedIn) {

        /**
         * =========================================================================
         * GENERIC TABLE PIPELINE (SEARCH, SORT, FILTER PERIODE, PAGINATION 50 DATA)
         * =========================================================================
         */
        function processTableData(dataArray, moduleKey) {
            var st = TableState[moduleKey] || { search: '', startDate: '', endDate: '', page: 1, pageSize: 50, sortCol: '', sortDir: 'asc' };
            var result = [].concat(dataArray || []);

            // 1. Filter Periode (Rentang Tanggal jika diisi)
            if (st.startDate || st.endDate) {
                var fStart = normalizeDateStr(st.startDate);
                var fEnd = normalizeDateStr(st.endDate);
                result = result.filter(function (row) {
                    var rawDate = row['Tanggal'] || row['Waktu'] || row['waktu'] || row['tanggal'] || row['Tanggal Dibuat'] || row['waktuTransaksi'] || '';
                    var rowDate = normalizeDateStr(rawDate);
                    if (!rowDate) return true;
                    if (fStart && rowDate < fStart) return false;
                    if (fEnd && rowDate > fEnd) return false;
                    return true;
                });
            }

            // 1b. Filter Wilayah / Area jika dipilih
            if (st.wilayahFilter && st.wilayahFilter !== 'SEMUA') {
                result = result.filter(function (row) {
                    var wCode = row['Kode Wilayah'] || row['kodeWilayah'] || row['Wilayah'] || '';
                    if (!wCode && (row['Kode Outlet'] || row['kodeOutlet'])) {
                        var kOut = String(row['Kode Outlet'] || row['kodeOutlet']).trim();
                        var o = (AppState.outlet || []).find(function(x) { return String(x['Kode Outlet']).trim() === kOut; });
                        if (o) wCode = o['Kode Wilayah'];
                    }
                    return String(wCode).trim() === String(st.wilayahFilter).trim();
                });
            }

            // 2. Search Multi-Kolom
            if (st.search) {
                var q = st.search.toLowerCase();
                result = result.filter(function (row) {
                    return Object.keys(row).some(function (k) {
                        var val = row[k];
                        return val !== null && val !== undefined && String(val).toLowerCase().indexOf(q) !== -1;
                    });
                });
            }

            // 3. Sorting Kolom
            if (st.sortCol) {
                result.sort(function (a, b) {
                    var valA = a[st.sortCol];
                    var valB = b[st.sortCol];
                    if (valA === undefined || valA === null) valA = '';
                    if (valB === undefined || valB === null) valB = '';

                    var numA = parseSafeNumber(valA);
                    var numB = parseSafeNumber(valB);
                    var isNumA = typeof valA === 'number' || (typeof valA === 'string' && valA.trim() !== '' && /^[\sRpIDR\d.,\-()]+$/.test(valA.trim()));
                    var isNumB = typeof valB === 'number' || (typeof valB === 'string' && valB.trim() !== '' && /^[\sRpIDR\d.,\-()]+$/.test(valB.trim()));
                    if (isNumA && isNumB) {
                        return st.sortDir === 'asc' ? numA - numB : numB - numA;
                    }
                    return st.sortDir === 'asc' ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
                });
            }

            // 4. Pagination 50 per halaman
            var totalItems = result.length;
            var totalPages = Math.max(1, Math.ceil(totalItems / st.pageSize));
            if (st.page > totalPages) st.page = totalPages;
            if (st.page < 1) st.page = 1;

            var startIndex = (st.page - 1) * st.pageSize;
            var paginatedRows = result.slice(startIndex, startIndex + st.pageSize);

            return {
                rows: paginatedRows,
                totalItems: totalItems,
                totalPages: totalPages,
                currentPage: st.page,
                startIndex: totalItems === 0 ? 0 : startIndex + 1,
                endIndex: Math.min(startIndex + st.pageSize, totalItems)
            };
        }

        function changeTableSort(moduleKey, colName) {
            var st = TableState[moduleKey];
            if (!st) return;
            if (st.sortCol === colName) {
                st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                st.sortCol = colName;
                st.sortDir = 'asc';
            }
            refreshModuleTable(moduleKey);
        }

        function changeTablePage(moduleKey, delta) {
            var st = TableState[moduleKey];
            if (!st) return;
            st.page += delta;
            refreshModuleTable(moduleKey);
        }

        function setTableSearch(moduleKey, value) {
            var st = TableState[moduleKey];
            if (!st) return;
            st.search = (value || '').trim();
            st.page = 1;
            refreshModuleTable(moduleKey);
        }

        function setTableWilayahFilter(moduleKey, value) {
            var st = TableState[moduleKey];
            if (!st) return;
            st.wilayahFilter = (value || 'SEMUA').trim();
            st.page = 1;
            refreshModuleTable(moduleKey);
        }

        function refreshModuleTable(moduleKey) {
            if (moduleKey === 'kunjungan') renderKunjunganCards();
            else if (moduleKey === 'stokSales') renderStokSalesTable();
            else if (moduleKey === 'pos') renderRiwayatPOSTable();
            else if (moduleKey === 'absensi') renderRiwayatAbsensiTable();
            else if (moduleKey === 'outlet') renderOutletTable();
            else if (moduleKey === 'produk') renderProdukTable();
            else if (moduleKey === 'wilayah') renderWilayahTable();
            else if (moduleKey === 'users') renderUsersTable();
        }

        /**
         * =========================================================================
         * NOTIFIKASI AKTIVITAS REAL-TIME LINTAS ROLE (NOTIFICATION CENTER)
         * - Reset harian otomatis (hanya menampilkan notifikasi hari ini)
         * - Angka merah (badge) HANYA muncul saat ada notifikasi baru pertama kali masuk
         * - Saat lonceng diklik terbuka, angka merah langsung di-reset (hilang)
         * - Angka merah baru muncul lagi jika ada notifikasi baru berikutnya
         * =========================================================================
         */
        AppState.activeNotifCategory = 'all';
        AppState.notifPollInterval = null;

        function getNotifDateKey() {
            var now = new Date();
            var y = now.getFullYear();
            var m = String(now.getMonth() + 1).padStart(2, '0');
            var d = String(now.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function checkDailyNotifReset() {
            var todayKey = getNotifDateKey();
            try {
                var storedDate = localStorage.getItem('margantara_notif_date');
                if (storedDate !== todayKey) {
                    // Hari berganti -> Bersihkan cache notifikasi, seen IDs & read IDs hari kemarin
                    localStorage.setItem('margantara_notif_date', todayKey);
                    localStorage.setItem('margantara_seen_notif_ids', JSON.stringify([]));
                    localStorage.setItem('margantara_read_notif_ids', JSON.stringify([]));
                    AppState.notifications = [];
                    updateNotifBadgeUI(0);
                }
            } catch (e) { }
        }

        function getSeenNotifIds() {
            checkDailyNotifReset();
            try {
                var raw = localStorage.getItem('margantara_seen_notif_ids');
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveSeenNotifIds(ids) {
            checkDailyNotifReset();
            try {
                localStorage.setItem('margantara_seen_notif_ids', JSON.stringify(ids || []));
            } catch (e) { }
        }

        function getReadNotifIds() {
            checkDailyNotifReset();
            try {
                var raw = localStorage.getItem('margantara_read_notif_ids');
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveReadNotifIds(ids) {
            checkDailyNotifReset();
            try {
                localStorage.setItem('margantara_read_notif_ids', JSON.stringify(ids || []));
            } catch (e) { }
        }

        function formatNotificationSimpleTime(rawTime) {
            if (!rawTime) return '';
            var s = String(rawTime).trim();
            if (s.indexOf('WIB') !== -1) return s;
            var match = s.match(/(?:^|\s|T)(\d{1,2}):(\d{2})(?::\d{2})?/);
            if (match) {
                var hh = ('0' + match[1]).slice(-2);
                var mm = match[2];
                return hh + ':' + mm + ' WIB';
            }
            try {
                var d = new Date(s);
                if (!isNaN(d.getTime())) {
                    var hours = ('0' + d.getHours()).slice(-2);
                    var mins = ('0' + d.getMinutes()).slice(-2);
                    return hours + ':' + mins + ' WIB';
                }
            } catch (e) {}
            return s;
        }

        function updateNotifBadgeUI(unreadCount) {
            var badge = document.getElementById('notif-badge');
            if (!badge) return;
            if (unreadCount > 0) {
                badge.innerText = unreadCount > 9 ? '9+' : unreadCount;
                badge.classList.remove('hidden');
                badge.style.display = 'flex';
            } else {
                badge.innerText = '0';
                badge.classList.add('hidden');
                badge.style.display = 'none';
            }
        }

        function markAllNotificationsAsSeen() {
            var seen = getSeenNotifIds();
            var notifs = AppState.notifications || [];
            var changed = false;

            notifs.forEach(function (n) {
                if (n.id && seen.indexOf(n.id) === -1) {
                    seen.push(n.id);
                    changed = true;
                }
            });

            if (changed) {
                saveSeenNotifIds(seen);
            }

            // Saat lonceng dibuka, badge merah di-reset jadi 0
            updateNotifBadgeUI(0);
        }

        function loadActivityNotifications() {
            checkDailyNotifReset();

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (res && res.success) {
                            var rawNotifs = res.notifications || [];
                            var readIds = getReadNotifIds();
                            var seenIds = getSeenNotifIds();

                            // Filter: Notifikasi yang sudah pernah diklik "sudah dibaca" TIDAK AKAN MUNCUL LAGI
                            var activeNotifs = rawNotifs.filter(function (n) {
                                return readIds.indexOf(n.id) === -1;
                            });

                            // Notifikasi baru adalah notifikasi aktif yang belum ada di seenIds
                            var unreadCount = activeNotifs.filter(function (n) {
                                return seenIds.indexOf(n.id) === -1;
                            }).length;

                            AppState.notifications = activeNotifs;

                            var menu = document.getElementById('notification-dropdown-menu');
                            if (menu && !menu.classList.contains('hidden') && menu.style.display !== 'none') {
                                markAllNotificationsAsSeen();
                            } else {
                                updateNotifBadgeUI(unreadCount);
                            }
                            renderNotificationDropdown();
                        }
                    })
                    .withFailureHandler(function () { })
                    .apiCall('getActivityNotifications', {
                        userRole: AppState.currentUser ? AppState.currentUser.role : 'Sales',
                        userId: AppState.currentUser ? AppState.currentUser.userId : ''
                    });
            } else {
                AppState.notifications = [];
                updateNotifBadgeUI(0);
                renderNotificationDropdown();
            }

            // Mulai auto-polling periodik setiap 35 detik jika belum aktif
            if (!AppState.notifPollInterval) {
                AppState.notifPollInterval = setInterval(function () {
                    loadActivityNotifications();
                }, 35000);
            }
        }

        function toggleNotificationDropdown(e) {
            if (e) {
                e.stopPropagation();
                if (e.preventDefault) e.preventDefault();
            }
            var menu = document.getElementById('notification-dropdown-menu');
            if (!menu) return;

            var isCurrentlyHidden = menu.classList.contains('hidden') || menu.style.display === 'none';
            if (isCurrentlyHidden) {
                // Saat lonceng diklik terbuka:
                // 1. Matikan gesture swipe-to-refresh Android agar saat list notifikasi di-scroll ke atas tidak merefresh aplikasi
                if (window.AndroidBridge && typeof window.AndroidBridge.setCanRefresh === 'function') {
                    window.AndroidBridge.setCanRefresh(false);
                }
                menu.classList.remove('hidden');
                menu.style.display = 'block';
                // 2. Langsung pastikan dropdown terisi konten (notif atau pesan kotak kosong yang rapi)
                renderNotificationDropdown();
                // 3. Langsung reset angka merah dan simpan ke seen IDs
                markAllNotificationsAsSeen();
            } else {
                menu.classList.add('hidden');
                menu.style.display = 'none';
                if (typeof syncScrollToAndroid === 'function') syncScrollToAndroid();
            }
            closeProfileDropdown();
        }

        function closeNotificationDropdown() {
            var menu = document.getElementById('notification-dropdown-menu');
            if (menu) {

                menu.style.display = 'none';
            }

        }

        function handleNotificationClick(notifId, actionTab) {
            var read = getReadNotifIds();
            if (notifId && read.indexOf(notifId) === -1) {
                read.push(notifId);
                saveReadNotifIds(read);
            }

            // Hapus notifikasi yang diklik agar tidak muncul lagi
            if (AppState.notifications) {
                AppState.notifications = AppState.notifications.filter(function (n) {
                    return n.id !== notifId;
                });
            }

            closeNotificationDropdown();
            renderNotificationDropdown();
            if (actionTab) {
                switchTab(actionTab);
            }
        }

                    '    <i class="' + emptyIcon + '"></i>' +

                    '  <p class="text-[11px] text-slate-400 mt-0.5 leading-snug">' + emptySub + '</p>' +

            } else {
                container.innerHTML = filtered.map(function (n) {

                        catBadge = '<span class="inline-flex items-center px-1.5 py-0.2 rounded-md bg-rose-50 text-rose-600 text-[9px] font-extrabold border border-rose-200 shrink-0">PENTING</span>';
                    } else if (n.category === 'transaksi') {
