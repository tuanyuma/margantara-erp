        function openPeriodFilterModal(moduleKey, moduleTitle) {
            AppState.activePeriodModule = moduleKey;
            var st = TableState[moduleKey] || {};
            document.getElementById('period-filter-title').innerText = 'Filter Periode - ' + moduleTitle;

            // Populate Year Dropdowns if not populated
            var curYear = new Date().getFullYear();
            var monthYearSelect = document.getElementById('filter-month-year');
            var yearSelect = document.getElementById('filter-year-only');

            if (monthYearSelect && monthYearSelect.options.length === 0) {
                for (var y = curYear + 1; y >= curYear - 4; y--) {
                    monthYearSelect.add(new Option(y, y, y === curYear, y === curYear));
                }
            }
            if (yearSelect && yearSelect.options.length === 0) {
                for (var y2 = curYear + 1; y2 >= curYear - 4; y2--) {
                    yearSelect.add(new Option('Tahun ' + y2, y2, y2 === curYear, y2 === curYear));
                }
            }

            // Default values
            document.getElementById('period-start-date').value = st.startDate || '';
            document.getElementById('period-end-date').value = st.endDate || '';

            var curMonth = String(new Date().getMonth() + 1).padStart(2, '0');
            var monthSelect = document.getElementById('filter-month-select');
            if (monthSelect) monthSelect.value = curMonth;

            switchPeriodFilterTab('range');
            openModal('modal-period-filter');
        }

        function applyPeriodFilter() {
            var mod = AppState.activePeriodModule;
            var tab = AppState.activePeriodTab || 'range';
            var start = '';
            var end = '';

            if (tab === 'range') {
                start = document.getElementById('period-start-date').value;
                end = document.getElementById('period-end-date').value;
                if (start && end && start > end) {
                    showToast('error', 'Tanggal mulai tidak boleh lebih besar dari tanggal akhir!');
                    return;
                }
            } else if (tab === 'month') {
                var m = document.getElementById('filter-month-select').value;
                var y = document.getElementById('filter-month-year').value;
                start = y + '-' + m + '-01';
                var lastDay = new Date(Number(y), Number(m), 0).getDate();
                end = y + '-' + m + '-' + String(lastDay).padStart(2, '0');
            } else if (tab === 'year') {
                var yOnly = document.getElementById('filter-year-only').value;
                start = yOnly + '-01-01';
                end = yOnly + '-12-31';
            } else if (tab === 'all') {
                start = '';
                end = '';
            }

            if (mod === 'dashboard') {
                AppState.dashboardStartDate = start;
                AppState.dashboardEndDate = end;
                TableState.dashboard.startDate = start;
                TableState.dashboard.endDate = end;
                closeModal('modal-period-filter');
                var pSelect = document.getElementById('dashboard-period-filter');
                if (pSelect) pSelect.value = 'CUSTOM';
                showLoading('Memuat data dashboard...');
                loadDashboardData();
                if (!start && !end) {
                    showToast('info', 'Menampilkan semua data dashboard.');
                } else {
                    showToast('info', 'Filter periode dashboard diterapkan (' + (start || 'Awal') + ' s.d. ' + (end || 'Akhir') + ').');
                }
                return;
            }

            TableState[mod].startDate = start;
            TableState[mod].endDate = end;
            TableState[mod].page = 1;
            closeModal('modal-period-filter');
            refreshModuleTable(mod);

            if (!start && !end) {
                showToast('info', 'Menampilkan semua data.');
            } else {
                showToast('info', 'Filter periode diterapkan (' + (start || 'Awal') + ' s.d. ' + (end || 'Akhir') + ').');
            }
        }

        function resetPeriodFilter() {
            switchPeriodFilterTab('all');
            applyPeriodFilter();
        }

        function openModalKunjunganCheckin(kode) {
            var o = AppState.outlet.find(function (item) { return item['Kode Outlet'] === kode; });
            if (!o) return;
            AppState.activeVisitOutlet = o;
            var oLat = Number(o['Latitude']) || 0;
            var oLng = Number(o['Longitude']) || 0;
            var hasCoords = (oLat !== 0 || oLng !== 0) && !isNaN(oLat) && !isNaN(oLng);
            var dist = hasCoords ? calculateDistance(AppState.currentLat, AppState.currentLong, oLat, oLng) : 0;
            var maxRadius = Number(o['Radius Meter']) || 50;
            var isValid = !hasCoords || (dist <= maxRadius);

            document.getElementById('modal-visit-title').innerText = 'Kunjungan: ' + o['Nama Toko'];
            var badge = document.getElementById('modal-visit-dist-badge');
            if (!hasCoords) {
                badge.innerText = 'Titik GPS Toko Belum Disetel (Check-in Diizinkan)';
                badge.className = 'text-xs font-bold mt-0.5 text-amber-600';
            } else {
                badge.innerText = 'Jarak Anda: ' + dist + 'm (Batas: ' + maxRadius + 'm) - ' + (isValid ? 'Valid' : 'Di Luar Radius');
                badge.className = 'text-xs font-bold mt-0.5 ' + (isValid ? 'text-emerald-600' : 'text-rose-600');
            }

            var now = new Date();
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var day = String(now.getDate()).padStart(2, '0');
            var tglStr = year + '-' + month + '-' + day;
            var jamStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            var tglEl = document.getElementById('visit-input-tanggal');
            var jamEl = document.getElementById('visit-input-jam');
            if (tglEl) tglEl.value = tglStr;
            if (jamEl) jamEl.value = jamStr;

            var btn = document.getElementById('btn-submit-visit-checkin');
            if (!isValid) {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            renderCheckinStokInputs();
            openModal('modal-kunjungan-checkin');
        }

                            AppState.kunjungan.push({
                                'Kode Outlet': payload.kodeOutlet,

                                'Jam': payload.jam || getNowTimeString(),

        function getBrandBallConversion(brandName) {
            var b = String(brandName || '').trim().toUpperCase();
            if (AppState.currentReportBrandRatios && AppState.currentReportBrandRatios[b]) {
                return Number(AppState.currentReportBrandRatios[b]);
            }
            if (AppState.produk && AppState.produk.length > 0) {
                var p = AppState.produk.find(function(it) {
                    var s = String(it['Singkatan'] || '').trim().toUpperCase();
                    var n = String(it['Nama Produk'] || '').trim().toUpperCase();
                    var k = String(it['Kode Produk'] || '').trim().toUpperCase();
                    return s === b || n === b || k === b || (s && b.indexOf(s) !== -1);
                });
                if (p) {
                    var val = Number(p['Isi Per Bal'] || p['Isi Per Bal (Bks)'] || p['Konversi Bal']);
                    if (!isNaN(val) && val > 0) return val;
                }
            }
            if (b === 'PSE' || b === 'MILD' || b === 'PSMI' || b === 'MANGGA' || b === 'PSMGO' || 
                b === 'PURPLE' || b === 'PSPLR' || b === 'WT MELON' || b === 'WTMELON' || b === 'PSWTM' || 
                b === 'APEL' || b === 'PSAPL' || b === 'ARTI APEL MADU' || b === 'AAM' || 
                b.indexOf('100') !== -1 || b.indexOf('SPLASH') !== -1 || b.indexOf('EXCLUSIVE') !== -1 || 
                b.indexOf('MILD') !== -1 || b.indexOf('MANGGA') !== -1 || b.indexOf('PURPLE') !== -1 || 
                b.indexOf('MELON') !== -1 || b.indexOf('APEL') !== -1) {
                return 100;
            }
            return 200;
        }

                });
                omsetBrands.forEach(function (ob) {
                    var actBall = (summary.totalBallPerBrand && summary.totalBallPerBrand[ob.key] !== undefined)
                        ? summary.totalBallPerBrand[ob.key]
                        : 0;
                    var tgt = (ob.targetBall !== undefined ? ob.targetBall : 0.3);
                    rowSisa.push(Number((actBall - tgt).toFixed(1)));
                });
                aoa.push(rowSisa);

                var ws = XLSX.utils.aoa_to_sheet(aoa);
                var wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Laporan Penjualan Harian');
                XLSX.writeFile(wb, 'Laporan_Penjualan_Harian_' + wilText.replace(/\s+/g, '_') + '_' + Date.now() + '.xlsx');
                showToast('success', 'File Excel Laporan Penjualan Harian berhasil diunduh.');
                return;
            }

            var ws = XLSX.utils.json_to_sheet(AppState.currentReportRows);
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Laporan');
            XLSX.writeFile(wb, 'Laporan_' + Date.now() + '.xlsx');
            showToast('success', 'File Excel berhasil diunduh.');
        }

        function printReportDocument() {

            var pPeriod = document.getElementById('print-report-period');
            var pWil = document.getElementById('print-report-wilayah');
            var pTime = document.getElementById('print-report-timestamp');
            var pRows = document.getElementById('print-summary-total-rows');
            var pExtra = document.getElementById('print-summary-extra');

            var pLogo = document.getElementById('print-logo-img');

                    pLogo.classList.remove('hidden');
                } else {
                    pLogo.classList.add('hidden');
                }
            }

            if (pComp) pComp.innerText = compName.toUpperCase();
            if (pSub) pSub.innerText = appName + ' • Sistem Monitoring Sales, POS & Rekapitulasi Lapangan';
            if (pType) pType.innerText = typeText;
            if (pPeriod) pPeriod.innerText = (start || 'Awal') + ' s.d. ' + (end || 'Sekarang');
            if (pWil) pWil.innerText = wilText;
            if (pTime) {
                var now = new Date();

                pTime.innerText = now.toLocaleDateString('id-ID') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ' WIB • ' + userName;
            }
            if (pRows) pRows.innerText = 'Total Data: ' + AppState.currentReportRows.length + ' Baris';

            if (pExtra) {
                var typeVal = typeSelect ? typeSelect.value : '';
                if (typeVal === 'PENJUALAN') {
                    var totalOmzet = 0;
                    AppState.currentReportRows.forEach(function (r) {
                        totalOmzet += Number(r.totalAkhir) || 0;
                    });
                    pExtra.innerText = 'Total Nilai Omzet: ' + formatRupiah(totalOmzet);
                } else if (typeVal === 'BRAND_MATRIX') {
                    var totalBks = 0;
                    AppState.currentReportRows.forEach(function (r) {
                        totalBks += Number(r.totalBks) || 0;
                    });
                    pExtra.innerText = 'Total Volume: ' + totalBks.toLocaleString('id-ID') + ' Bks (~ ' + (totalBks / 200).toFixed(2) + ' Ball)';
                } else {
                    pExtra.innerText = '';
                }
            }

            document.body.classList.remove('printing-receipt');
            document.body.classList.add('printing-report');
            window.print();
            setTimeout(function () {
                document.body.classList.remove('printing-report');
            }, 1000);
        }

        window.addEventListener('afterprint', function () {
            document.body.classList.remove('printing-receipt');
            document.body.classList.remove('printing-report');
        });

        /**
         * =========================================================================
         * EXPORT DATA OUTLET KE FILE EXCEL DENGAN FORMAT SANGAT RAPI & PROFESIONAL
         * =========================================================================
         * Fitur Unggulan:
         * - Multi-row Title Banner & Metadata Cetak (Perusahaan, Waktu, Filter, Total)
         * - Header Berwarna Dark Navy/Slate dengan Font Putih Tebal
         * - Alternating Zebra Row (Zebra Striping Abu-abu Terang & Putih)
         * - Formatting Tipe Data Khusus (Nomor HP tetap berawalan 0 sebagai Text, Radius sebagai Angka)
         * - Badge Status Berwarna (Verified = Hijau, Pending = Kuning/Oranye)
         * - Badge Absensi (Ya = Hijau Lembut, Tidak = Abu-abu)
         * - Ringkasan / Summary Row di bagian bawah dengan total outlet & statistik
         * - Dynamic Auto-fit Lebar Kolom (Tidak ada teks terpotong / ###)
         * - AutoFilter terpasang di baris header Excel
         * - Penamaan File Otomatis Berdasarkan Filter Wilayah & Tanggal
         */
        function exportOutletToExcel() {
            if (typeof XLSX === 'undefined') {
                showToast('error', 'Library Excel belum siap. Silakan refresh halaman atau coba sesaat lagi.');
                return;
            }

            if (!AppState.outlet || AppState.outlet.length === 0) {
                showToast('warning', 'Belum ada data outlet untuk diunduh!');
                return;
            }

            try {
                showToast('info', 'Sedang menyiapkan data Excel...');

                var st = TableState['outlet'] || {};
                var rawList = [].concat(AppState.outlet || []);
                var filterWilayahName = 'SEMUA';

                // 1. Terapkan filter wilayah jika sedang aktif
                if (st.wilayahFilter && st.wilayahFilter !== 'SEMUA') {
                    rawList = rawList.filter(function (row) {
                        var wCode = row['Kode Wilayah'] || row['kodeWilayah'] || '';
                        return String(wCode).trim() === String(st.wilayahFilter).trim();
                    });
                    filterWilayahName = st.wilayahFilter;
                }

                // 2. Terapkan filter pencarian teks jika user sedang mencari di tabel
                if (st.search && st.search.trim()) {
                    var q = st.search.trim().toLowerCase();
                    rawList = rawList.filter(function (row) {
                        return Object.keys(row).some(function (k) {
                            var val = row[k];
                            return val !== null && val !== undefined && String(val).toLowerCase().indexOf(q) !== -1;
                        });
                    });
                }

                if (rawList.length === 0) {
                    showToast('warning', 'Tidak ada data outlet yang cocok dengan filter atau pencarian saat ini.');
                    return;
                }

                // Map Wilayah untuk menampilkan Nama Wilayah / Cabang secara lengkap
                var wilMap = {};
                (AppState.wilayah || []).forEach(function (w) {
                    var code = String(w['Kode Wilayah'] || '').trim();
                    if (code) {
                        var name = w['Nama Wilayah'] || w['Nama Kabupaten'] || code;
                        wilMap[code] = name;
                    }
                });

                // Hitung Statistik Outlet
                var totalCount = rawList.length;
                var verifiedCount = 0;
                var pendingCount = 0;
                var absensiCount = 0;
                var totalRadius = 0;
                var uniqueWilayah = {};

                rawList.forEach(function (o) {
                    var stat = String(o['Status Verifikasi'] || '').trim().toLowerCase();
                    if (stat === 'verified') verifiedCount++;
                    else pendingCount++;

                    var abs = String(o['Bisa Untuk Absensi'] || '').trim().toLowerCase();
                    if (abs === 'ya') absensiCount++;

                    var rad = Number(o['Radius Meter']) || 50;
                    totalRadius += rad;

                    var wCode = String(o['Kode Wilayah'] || '-').trim();
                    if (wCode && wCode !== '-') uniqueWilayah[wCode] = true;
                });

                var avgRadius = Math.round(totalRadius / totalCount) || 50;

                // Definisi Styling Warna (RGB Hex tanpa tanda #)
                var COLOR = {
                    TITLE_BG: '1E3A8A',     // Deep Navy
                    SUBTITLE_BG: '2563EB',  // Royal Blue
                    META_BG: 'F1F5F9',      // Slate Light
                    HEADER_BG: '1E293B',    // Slate Dark
                    ZEBRA_EVEN: 'F8FAFC',   // Ultra Light Slate
                    ZEBRA_ODD: 'FFFFFF',    // White
                    BORDER: 'CBD5E1',       // Slate 300
                    BORDER_DARK: '94A3B8',  // Slate 400
                    SUMMARY_BG: 'E2E8F0',   // Slate 200
                    VERIFIED_TEXT: '065F46',// Emerald 800
                    VERIFIED_BG: 'D1FAE5',  // Emerald 100
                    PENDING_TEXT: '92400E', // Amber 800
                    PENDING_BG: 'FEF3C7',   // Amber 100
                    ABSEN_YA_TEXT: '047857',// Emerald 700
                    ABSEN_YA_BG: 'ECFDF5',  // Emerald 50
                    ABSEN_NO_TEXT: '64748B',// Slate 500
                    ABSEN_NO_BG: 'F8FAFC',  // Slate 50
                    TEXT_MAIN: '0F172A',    // Slate 900
                    TEXT_MUTED: '475569'    // Slate 600
                };

                var borderThin = {
                    top: { style: 'thin', color: { rgb: COLOR.BORDER } },
                    bottom: { style: 'thin', color: { rgb: COLOR.BORDER } },
                    left: { style: 'thin', color: { rgb: COLOR.BORDER } },
                    right: { style: 'thin', color: { rgb: COLOR.BORDER } }
                };

                var borderSummary = {
                    top: { style: 'thin', color: { rgb: COLOR.BORDER_DARK } },
                    bottom: { style: 'double', color: { rgb: COLOR.TEXT_MAIN } },
                    left: { style: 'thin', color: { rgb: COLOR.BORDER } },
                    right: { style: 'thin', color: { rgb: COLOR.BORDER } }
                };

                var headerStyle = {
                    fill: { fgColor: { rgb: COLOR.HEADER_BG } },
                    font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: 'FFFFFF' } },
                    alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
                    border: {
                        top: { style: 'thin', color: { rgb: '475569' } },
                        bottom: { style: 'medium', color: { rgb: '0F172A' } },
                        left: { style: 'thin', color: { rgb: '475569' } },
                        right: { style: 'thin', color: { rgb: '475569' } }
                    }
                };

                var title1Style = {
                    fill: { fgColor: { rgb: COLOR.TITLE_BG } },
                    font: { name: 'Calibri', sz: 14, bold: true, color: { rgb: 'FFFFFF' } },
                    alignment: { horizontal: 'center', vertical: 'center' }
                };

                var title2Style = {
                    fill: { fgColor: { rgb: COLOR.SUBTITLE_BG } },
                    font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: 'FFFFFF' } },
                    alignment: { horizontal: 'center', vertical: 'center' }
                };

                var metaStyle = {
                    fill: { fgColor: { rgb: COLOR.META_BG } },
                    font: { name: 'Calibri', sz: 9, italic: true, color: { rgb: COLOR.TEXT_MUTED } },
                    alignment: { horizontal: 'center', vertical: 'center' },
                    border: {
                        bottom: { style: 'thin', color: { rgb: COLOR.BORDER } }
                    }
                };

                var NUM_COLS = 15;
                var headers = [
                    'NO',
                    'KODE OUTLET',
                    'NAMA TOKO / OUTLET',
                    'NAMA PEMILIK',
                    'NOMOR HP / WA',
                    'KODE WILAYAH',
                    'WILAYAH / CABANG',
                    'HARI KUNJUNGAN',
                    'RADIUS (METER)',
                    'IZIN ABSENSI',
                    'STATUS VERIFIKASI',
                    'ALAMAT TOKO',
                    'LINK GOOGLE MAPS',
                    'KOORDINAT GPS',
                    'TANGGAL DIBUAT'
                ];

                var aoa = [];

                // Baris 1: Title
                var rowTitle1 = [];
                for (var c = 0; c < NUM_COLS; c++) {
                    rowTitle1.push({ v: c === 0 ? 'DATA MASTER & MANAJEMEN OUTLET' : '', t: 's', s: title1Style });
                }
                aoa.push(rowTitle1);

                // Baris 2: Subtitle (Nama Perusahaan & Sistem)
                var companyName = (AppState.config && AppState.config['Nama Perusahaan']) || 'Margantara Jaya Corps';
                var appName = (AppState.config && AppState.config['Nama Aplikasi']) || 'TokoTrack Pro';
                var rowTitle2 = [];
                for (var c = 0; c < NUM_COLS; c++) {
                    rowTitle2.push({ v: c === 0 ? (companyName + ' - ' + appName) : '', t: 's', s: title2Style });
                }
                aoa.push(rowTitle2);

                // Baris 3: Meta Info (Waktu Export, Filter, User, Ringkasan)
                var now = new Date();
                var timeStr = String(now.getDate()).padStart(2, '0') + '/' +
                    String(now.getMonth() + 1).padStart(2, '0') + '/' +
                    now.getFullYear() + ' ' +
                    String(now.getHours()).padStart(2, '0') + ':' +
                    String(now.getMinutes()).padStart(2, '0') + ' WIB';
                var userName = (AppState.currentUser && AppState.currentUser.namaLengkap) || 'Admin';
                var metaText = 'Waktu Cetak: ' + timeStr + ' | Filter: ' + filterWilayahName +
                    ' | User: ' + userName +
                    ' | Total: ' + totalCount + ' Outlet (Verified: ' + verifiedCount + ', Pending: ' + pendingCount + ', Absensi: ' + absensiCount + ')';
                var rowMeta = [];
                for (var c = 0; c < NUM_COLS; c++) {
                    rowMeta.push({ v: c === 0 ? metaText : '', t: 's', s: metaStyle });
                }
                aoa.push(rowMeta);

                // Baris 4: Spacer Kosong
                var rowSpacer = [];
                for (var c = 0; c < NUM_COLS; c++) {
                    rowSpacer.push({ v: '', t: 's' });
                }
                aoa.push(rowSpacer);

                // Baris 5: Column Headers
                var rowHeaders = headers.map(function (h) {
                    return { v: h, t: 's', s: headerStyle };
                });
                aoa.push(rowHeaders);

                // Track panjang teks maksimal untuk auto-fit kolom
                var colMaxLengths = headers.map(function (h) { return h.length; });
                colMaxLengths[0] = 5;  // NO
                colMaxLengths[1] = 13; // KODE
                colMaxLengths[2] = 25; // NAMA TOKO
                colMaxLengths[3] = 18; // PEMILIK
                colMaxLengths[4] = 16; // NO HP
                colMaxLengths[5] = 14; // KODE WILAYAH
                colMaxLengths[6] = 22; // WILAYAH
                colMaxLengths[7] = 15; // HARI KUNJUNGAN
                colMaxLengths[8] = 14; // RADIUS
                colMaxLengths[9] = 13; // ABSENSI
                colMaxLengths[10] = 18; // STATUS
                colMaxLengths[11] = 30; // ALAMAT
                colMaxLengths[12] = 22; // MAPS
                colMaxLengths[13] = 22; // KOORDINAT
                colMaxLengths[14] = 18; // TANGGAL

                // Baris 6+: Data Rows
                rawList.forEach(function (o, idx) {
                    var isEven = (idx % 2 === 0);
                    var bgHex = isEven ? COLOR.ZEBRA_EVEN : COLOR.ZEBRA_ODD;

                    var cellBaseStyle = {
                        fill: { fgColor: { rgb: bgHex } },
                        font: { name: 'Calibri', sz: 10, color: { rgb: COLOR.TEXT_MAIN } },
                        border: borderThin
                    };

                    var styleCenter = Object.assign({}, cellBaseStyle, {
                        alignment: { horizontal: 'center', vertical: 'center' }
                    });

                    var styleLeft = Object.assign({}, cellBaseStyle, {
                        alignment: { horizontal: 'left', vertical: 'center' }
                    });

                    var styleRight = Object.assign({}, cellBaseStyle, {
                        alignment: { horizontal: 'right', vertical: 'center' }
                    });

                    var styleCode = Object.assign({}, cellBaseStyle, {
                        font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: COLOR.TEXT_MAIN } },
                        alignment: { horizontal: 'center', vertical: 'center' }
                    });

                    var styleStoreName = Object.assign({}, cellBaseStyle, {
                        font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: COLOR.TEXT_MAIN } },
                        alignment: { horizontal: 'left', vertical: 'center' }
                    });

                    // Status verifikasi badge style
                    var isVerified = String(o['Status Verifikasi'] || '').trim().toLowerCase() === 'verified';
                    var styleStatus = Object.assign({}, cellBaseStyle, {
                        fill: { fgColor: { rgb: isVerified ? COLOR.VERIFIED_BG : COLOR.PENDING_BG } },
                        font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: isVerified ? COLOR.VERIFIED_TEXT : COLOR.PENDING_TEXT } },
                        alignment: { horizontal: 'center', vertical: 'center' }
                    });

                    // Bisa absensi badge style
                    var isAbsen = String(o['Bisa Untuk Absensi'] || '').trim().toLowerCase() === 'ya';
                    var styleAbsen = Object.assign({}, cellBaseStyle, {
                        fill: { fgColor: { rgb: isAbsen ? COLOR.ABSEN_YA_BG : COLOR.ABSEN_NO_BG } },
                        font: { name: 'Calibri', sz: 10, bold: isAbsen, color: { rgb: isAbsen ? COLOR.ABSEN_YA_TEXT : COLOR.ABSEN_NO_TEXT } },
                        alignment: { horizontal: 'center', vertical: 'center' }
                    });

                    // Data values
                    var noVal = idx + 1;
                    var kodeVal = String(o['Kode Outlet'] || '-').trim();
                    var tokoVal = String(o['Nama Toko'] || '-').trim();
                    var pemilikVal = String(o['Nama Pemilik'] || '-').trim();
                    var hpVal = String(o['Nomor HP'] || o['nomorHp'] || '-').trim();
                    var wilCodeVal = String(o['Kode Wilayah'] || '-').trim();
                    var wilNameVal = wilMap[wilCodeVal] ? (wilMap[wilCodeVal] + ' (' + wilCodeVal + ')') : wilCodeVal;
                    var hariVal = String(o['Hari Kunjungan'] || 'Setiap Hari').trim();
                    var radiusVal = Number(o['Radius Meter']) || 50;
                    var absenVal = String(o['Bisa Untuk Absensi'] || 'Tidak').trim();
                    var statusVal = isVerified ? 'Verified' : 'Pending';
                    var alamatVal = String(o['Alamat'] || '-').trim();
                    var mapsVal = String(o['Link Google Maps'] || '-').trim();

                    // Koordinat GPS
                    var lat = (o['Latitude'] !== undefined && o['Latitude'] !== null && o['Latitude'] !== '') ? Number(o['Latitude']) : null;
                    var lng = (o['Longitude'] !== undefined && o['Longitude'] !== null && o['Longitude'] !== '') ? Number(o['Longitude']) : null;
                    var gpsVal = (lat !== null && lng !== null && (lat !== 0 || lng !== 0)) ? (lat.toFixed(6) + ', ' + lng.toFixed(6)) : '-';

                    // Tanggal Dibuat
                    var rawDate = o['Tanggal Dibuat'] || o['tanggalDibuat'] || '';
                    var tglVal = '-';
                    if (rawDate) {
                        var dObj = new Date(rawDate);
                        if (!isNaN(dObj.getTime())) {
                            tglVal = String(dObj.getDate()).padStart(2, '0') + '/' +
                                String(dObj.getMonth() + 1).padStart(2, '0') + '/' +
                                dObj.getFullYear() + ' ' +
                                String(dObj.getHours()).padStart(2, '0') + ':' +
                                String(dObj.getMinutes()).padStart(2, '0');
                        } else {
                            tglVal = String(rawDate).substring(0, 19);
                        }
                    }

                    // Susun row cell objek
                    var rowCells = [
                        { v: noVal, t: 'n', s: styleCenter, z: '#,##0' },
                        { v: kodeVal, t: 's', s: styleCode },
                        { v: tokoVal, t: 's', s: styleStoreName },
                        { v: pemilikVal, t: 's', s: styleLeft },
                        { v: hpVal, t: 's', s: styleCenter, z: '@' }, // Explicit Text format agar 0 tidak hilang
                        { v: wilCodeVal, t: 's', s: styleCenter },
                        { v: wilNameVal, t: 's', s: styleLeft },
                        { v: hariVal, t: 's', s: styleCenter },
                        { v: radiusVal, t: 'n', s: styleRight, z: '#,##0' },
                        { v: absenVal, t: 's', s: styleAbsen },
                        { v: statusVal, t: 's', s: styleStatus },
                        { v: alamatVal, t: 's', s: styleLeft },
                        { v: mapsVal, t: 's', s: styleLeft },
                        { v: gpsVal, t: 's', s: styleCenter },
                        { v: tglVal, t: 's', s: styleCenter }
                    ];

                    // Perbarui perkiraan panjang kolom
                    colMaxLengths[1] = Math.max(colMaxLengths[1], kodeVal.length);
                    colMaxLengths[2] = Math.max(colMaxLengths[2], Math.min(45, tokoVal.length));
                    colMaxLengths[3] = Math.max(colMaxLengths[3], Math.min(30, pemilikVal.length));
                    colMaxLengths[4] = Math.max(colMaxLengths[4], hpVal.length);
                    colMaxLengths[6] = Math.max(colMaxLengths[6], Math.min(35, wilNameVal.length));
                    colMaxLengths[11] = Math.max(colMaxLengths[11], Math.min(50, alamatVal.length));

                    aoa.push(rowCells);
                });

                // Baris Summary / Total di bagian bawah
                var summaryRowIdx = aoa.length;
                var rowSummary = [];
                var labelSummary = 'TOTAL: ' + totalCount + ' OUTLET';

                var summaryBaseStyle = {
                    fill: { fgColor: { rgb: COLOR.SUMMARY_BG } },
                    font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: COLOR.TEXT_MAIN } },
                    border: borderSummary,
                    alignment: { horizontal: 'center', vertical: 'center' }
                };

                for (var c = 0; c < NUM_COLS; c++) {
                    if (c === 0) {
                        rowSummary.push({ v: labelSummary, t: 's', s: Object.assign({}, summaryBaseStyle, { alignment: { horizontal: 'left', vertical: 'center' }, font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: '1E3A8A' } } }) });
                    } else if (c < 5) {
                        rowSummary.push({ v: '', t: 's', s: summaryBaseStyle });
                    } else if (c === 5) {
                        rowSummary.push({ v: Object.keys(uniqueWilayah).length + ' Area', t: 's', s: summaryBaseStyle });
                    } else if (c === 6) {
                        rowSummary.push({ v: '-', t: 's', s: summaryBaseStyle });
                    } else if (c === 7) {
                        rowSummary.push({ v: '-', t: 's', s: summaryBaseStyle });
                    } else if (c === 8) {
                        rowSummary.push({ v: avgRadius, t: 'n', s: Object.assign({}, summaryBaseStyle, { alignment: { horizontal: 'right', vertical: 'center' } }), z: '#,##0' });
                    } else if (c === 9) {
                        rowSummary.push({
                            v: absensiCount + ' Absen',
                            t: 's',
                            s: Object.assign({}, summaryBaseStyle, {
                                fill: { fgColor: { rgb: COLOR.ABSEN_YA_BG } },
                                font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: COLOR.ABSEN_YA_TEXT } }
                            })
                        });
                    } else if (c === 10) {
                        rowSummary.push({
                            v: verifiedCount + ' V / ' + pendingCount + ' P',
                            t: 's',
                            s: Object.assign({}, summaryBaseStyle, {
                                fill: { fgColor: { rgb: (pendingCount > 0 ? COLOR.PENDING_BG : COLOR.VERIFIED_BG) } },
                                font: { name: 'Calibri', sz: 10, bold: true, color: { rgb: (pendingCount > 0 ? COLOR.PENDING_TEXT : COLOR.VERIFIED_TEXT) } }
                            })
                        });
                    } else {
                        rowSummary.push({ v: '-', t: 's', s: summaryBaseStyle });
                    }
                }
                aoa.push(rowSummary);

                // Buat Worksheet & Workbook menggunakan SheetJS / xlsx-js-style
                var ws = XLSX.utils.aoa_to_sheet(aoa);

                // Atur Lebar Kolom (Widths)
                ws['!cols'] = colMaxLengths.map(function (len) {
                    return { wch: Math.max(10, len + 3) };
                });

                // Atur Tinggi Baris (Row Heights)
                var rowHeights = [
                    { hpt: 32 }, // Row 1 Title
                    { hpt: 22 }, // Row 2 Subtitle
                    { hpt: 20 }, // Row 3 Meta
                    { hpt: 10 }, // Row 4 Spacer
                    { hpt: 26 }  // Row 5 Header
                ];
                for (var r = 0; r < rawList.length; r++) {
                    rowHeights.push({ hpt: 22 }); // Data rows
                }
                rowHeights.push({ hpt: 24 }); // Summary row
                ws['!rows'] = rowHeights;

                // Atur Cell Merges
                ws['!merges'] = [
                    { s: { r: 0, c: 0 }, e: { r: 0, c: NUM_COLS - 1 } }, // Title
                    { s: { r: 1, c: 0 }, e: { r: 1, c: NUM_COLS - 1 } }, // Subtitle
                    { s: { r: 2, c: 0 }, e: { r: 2, c: NUM_COLS - 1 } }, // Meta info
                    { s: { r: summaryRowIdx, c: 0 }, e: { r: summaryRowIdx, c: 4 } } // Summary label A..E
                ];

                // AutoFilter di baris header (Baris ke-5 = r: 4)
                ws['!autofilter'] = {
                    ref: XLSX.utils.encode_range({
                        s: { r: 4, c: 0 },
                        e: { r: 4 + rawList.length, c: NUM_COLS - 1 }
                    })
                };

                var wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data Outlet');

                // Generate nama file rapih & informatif
                var fileDateStr = now.getFullYear() +
                    String(now.getMonth() + 1).padStart(2, '0') +
                    String(now.getDate()).padStart(2, '0') + '_' +
                    String(now.getHours()).padStart(2, '0') +
                    String(now.getMinutes()).padStart(2, '0');
                var safeWilName = filterWilayahName.replace(/[^a-zA-Z0-9_-]/g, '_');
                var fileName = 'Data_Outlet_' + safeWilName + '_' + fileDateStr + '.xlsx';

                XLSX.writeFile(wb, fileName);
                showToast('success', 'File Excel Data Outlet (' + totalCount + ' data) berhasil diunduh!');
            } catch (err) {
                console.error('Error exportOutletToExcel:', err);
                showToast('error', 'Gagal mengekspor data outlet: ' + (err.message || 'Terjadi kesalahan sistem'));
            }
        }

        function handleOfficeMapsLinkInput(url) {
            if (!url) return;
            var match1 = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match2 = url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match3 = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
            var match4 = url.match(/query=(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match5 = url.match(/center=(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match6 = url.match(/^(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)$/);

            var m = match1 || match2 || match3 || match4 || match5 || match6;
            if (m) {
                var lat = Number(m[1]).toFixed(6);
                var lng = Number(m[2]).toFixed(6);
                var latEl = document.getElementById('cfg-office-lat');
                var lngEl = document.getElementById('cfg-office-lng');
                if (latEl) latEl.value = lat;
                if (lngEl) lngEl.value = lng;
                initOfficeLeafletMap(lat, lng);
                showToast('success', 'Koordinat Kantor terdeteksi dari Link Maps (' + lat + ', ' + lng + ')');
            }
        }

        function refreshAbsensiLocationStatus() {
            var userWilCode = (AppState.currentUser && AppState.currentUser.kodeWilayah) ? String(AppState.currentUser.kodeWilayah).trim() : '';
            var targetWil = AppState.wilayah.find(function (w) { return String(w['Kode Wilayah']).trim() === userWilCode; });

            var offLat = (targetWil && Number(targetWil['Latitude Kantor'])) ? Number(targetWil['Latitude Kantor']) : (Number(AppState.config['Latitude Kantor']) || 0);
            var offLng = (targetWil && Number(targetWil['Longitude Kantor'])) ? Number(targetWil['Longitude Kantor']) : (Number(AppState.config['Longitude Kantor']) || 0);
            var offRadius = (targetWil && Number(targetWil['Radius Absensi'])) ? Number(targetWil['Radius Absensi']) : (Number(AppState.config['Radius Default Kantor Meter']) || 100);
            var offName = targetWil ? (targetWil['Nama Wilayah'] || targetWil['Nama Kabupaten'] || ('Cabang ' + targetWil['Kode Wilayah'])) : (AppState.config['Nama Perusahaan'] || 'Kantor Pusat');

            var badge = document.getElementById('absensi-status-subtext');
            var officeInfo = document.getElementById('absensi-office-info');

            if (offLat === 0 && offLng === 0) {
                if (badge) {
                    badge.innerText = 'Titik GPS Kantor Wilayah Belum Diset oleh Admin';
                    badge.className = 'text-xs text-amber-600 font-bold mt-0.5';
                }
                return;
            }

            var dist = calculateDistance(AppState.currentLat, AppState.currentLong, offLat, offLng);
            var isInside = dist <= offRadius;
            var distStr = dist < 1000 ? (dist + ' meter') : ((dist / 1000).toFixed(1) + ' km');

            if (badge) {
                badge.innerText = (isInside ? 'GPS Terkunci (Dalam Radius Kantor: ' : 'Di Luar Radius Kantor (Jarak: ') + distStr + ' / Batas ' + offRadius + 'm)';
                badge.className = 'text-xs font-bold mt-0.5 ' + (isInside ? 'text-emerald-600' : 'text-rose-600');
            }
            if (officeInfo) {
                officeInfo.innerText = 'Titik Acuan: ' + offName + ' (' + offLat.toFixed(4) + ', ' + offLng.toFixed(4) + ')';
            }
        }

        function initWilayahLeafletMap(lat, lng, radius) {
            setTimeout(function () {
                var latNum = Number(lat) || Number(AppState.config['Latitude Kantor']) || AppState.currentLat || -7.265432;
                var lngNum = Number(lng) || Number(AppState.config['Longitude Kantor']) || AppState.currentLong || 112.748901;
                var radNum = Number(radius) || 100;

                var container = document.getElementById('wilayah-map-container');
                if (!container || typeof L === 'undefined') return;

                if (!AppState.leafletMaps.wilayah) {
                    AppState.leafletMaps.wilayah = L.map('wilayah-map-container', {
                        zoomControl: true,
                        attributionControl: false
                    }).setView([latNum, lngNum], 16);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(AppState.leafletMaps.wilayah);

                    var marker = L.marker([latNum, lngNum], { draggable: true }).addTo(AppState.leafletMaps.wilayah);
                    var circle = L.circle([latNum, lngNum], { radius: radNum, color: '#0284c7', fillColor: '#38bdf8', fillOpacity: 0.2 }).addTo(AppState.leafletMaps.wilayah);

                    marker.on('dragend', function (e) {
                        var pos = e.target.getLatLng();
                        updateWilayahCoordsInputs(pos.lat, pos.lng);
                        circle.setLatLng(pos);
                    });

                    AppState.leafletMaps.wilayah.on('click', function (e) {
                        marker.setLatLng(e.latlng);
                        circle.setLatLng(e.latlng);
                        updateWilayahCoordsInputs(e.latlng.lat, e.latlng.lng);
                    });

                    AppState.leafletMaps.wilayahMarker = marker;
                    AppState.leafletMaps.wilayahCircle = circle;
                } else {
                    AppState.leafletMaps.wilayah.invalidateSize();
                    AppState.leafletMaps.wilayah.setView([latNum, lngNum], 16);
                    if (AppState.leafletMaps.wilayahMarker) AppState.leafletMaps.wilayahMarker.setLatLng([latNum, lngNum]);
                    if (AppState.leafletMaps.wilayahCircle) {
                        AppState.leafletMaps.wilayahCircle.setLatLng([latNum, lngNum]);
                        AppState.leafletMaps.wilayahCircle.setRadius(radNum);
                    }
                }
            }, 250);
        }

        function updateWilayahCoordsInputs(lat, lng) {
            var latEl = document.getElementById('wil-lat');
            var lngEl = document.getElementById('wil-lng');
            if (latEl) latEl.value = Number(lat).toFixed(6);
            if (lngEl) lngEl.value = Number(lng).toFixed(6);
        }

        function lockGPSForWilayahMap() {
            showToast('info', 'Mencari sinyal GPS kantor cabang...');
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function (pos) {
                        AppState.currentLat = pos.coords.latitude;
                        AppState.currentLong = pos.coords.longitude;
                        updateWilayahCoordsInputs(pos.coords.latitude, pos.coords.longitude);
                        if (AppState.leafletMaps.wilayah) {
                            AppState.leafletMaps.wilayah.flyTo([pos.coords.latitude, pos.coords.longitude], 17);
                            if (AppState.leafletMaps.wilayahMarker) AppState.leafletMaps.wilayahMarker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
                            if (AppState.leafletMaps.wilayahCircle) AppState.leafletMaps.wilayahCircle.setLatLng([pos.coords.latitude, pos.coords.longitude]);
                        }
                        var acc = Math.round(pos.coords.accuracy || 10);
                        showToast('success', 'Titik GPS Kantor Wilayah berhasil dikunci! (Akurasi ' + acc + 'm)');
                    },
                    function (err) {
                        showToast('warning', 'GPS: ' + err.message + '. Silakan masukkan manual.');
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                showToast('error', 'Browser tidak mendukung Geolocation.');
            }
        }

        function handleWilayahMapsLinkInput(url) {
            if (!url) return;
            var match1 = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match2 = url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match3 = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
            var match4 = url.match(/query=(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match5 = url.match(/center=(-?\d+\.\d+),(-?\d+\.\d+)/);
            var match6 = url.match(/^(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)$/);

            var m = match1 || match2 || match3 || match4 || match5 || match6;
            if (m) {
                var lat = Number(m[1]).toFixed(6);
                var lng = Number(m[2]).toFixed(6);
                updateWilayahCoordsInputs(lat, lng);
                initWilayahLeafletMap(lat, lng);
                showToast('success', 'Koordinat Kantor Wilayah terdeteksi dari Link Maps (' + lat + ', ' + lng + ')');
            }
        }

        function editUser(userId, username) {
            var curRole = AppState.currentUser ? AppState.currentUser.role : 'Sales';

            var roleSelect = document.getElementById('usr-role');
            var wilSelect = document.getElementById('usr-wilayah');

            if (curRole === 'Admin') {
                roleSelect.innerHTML = '<option value="Sales" selected>Sales (Akun Lapangan)</option>';
                roleSelect.disabled = true;

                if (curWil && curWil !== 'SEMUA') {
                    var wilObj = AppState.wilayah.find(function (w) { return w['Kode Wilayah'] === curWil; });
                    var wilName = wilObj ? (wilObj['Nama Wilayah'] || wilObj['Nama Kabupaten']) : curWil;

        function handleLogoFileSelected(e) {
            var file = e.target.files && e.target.files[0];
            if (!file) return;

            if (!file.type.match(/^image\//)) {
                showToast('error', 'File yang dipilih harus berupa gambar (PNG, JPG, WebP)!');
                return;
            }

            var reader = new FileReader();
            var btn = document.getElementById('btn-upload-logo-trigger');
            var btnText = document.getElementById('btn-upload-logo-text');
            var origText = btnText ? btnText.innerText : 'Pilih File Logo (Upload Otomatis ke Drive)';

            reader.onload = function (evt) {
                var base64 = evt.target.result;
                
                // Live preview instan
                var prev = document.getElementById('cfg-logo-preview');
                if (prev) prev.src = base64;

                // Indikator loading
                if (btn) {
                    btn.disabled = true;
                    btn.classList.add('opacity-75', 'cursor-not-allowed');
                }
                if (btnText) btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Mengupload ke Google Drive...';

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(function (res) {
                            if (btn) {
                                btn.disabled = false;
                                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                            }
                            if (btnText) btnText.innerText = origText;

                            if (res && res.success) {
                                var directUrl = res.url;
                                document.getElementById('cfg-logo-url').value = directUrl;
                                if (!AppState.config) AppState.config = {};
                                AppState.config['Logo URL'] = directUrl;
                                try {
                                    localStorage.setItem('tokotrack_branding', JSON.stringify(AppState.config));
                                    sessionStorage.removeItem('tokotrack_cached_initial_data');
                                } catch (e) {}
                                applyBranding();
                                showToast('success', 'Logo berhasil diupload ke Google Drive & diatur ke Google CDN (lh3)!');
                            } else {
                                showToast('error', (res && res.message) || 'Gagal mengupload logo ke Google Drive');
                            }
                        })
                        .withFailureHandler(function (err) {
                            if (btn) {
                                btn.disabled = false;
                                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                            }
                            if (btnText) btnText.innerText = origText;
                            showToast('error', 'Gagal upload: ' + (err.message || err));
                        })
                        .apiCall('uploadLogo', { imageBase64: base64, fileName: file.name });
                } else {
                    if (btn) {
                        btn.disabled = false;
                        btn.classList.remove('opacity-75', 'cursor-not-allowed');
                    }
                    if (btnText) btnText.innerText = origText;
                    showToast('error', 'Koneksi ke Google Sheets tidak tersedia.');
                }
            };
            reader.readAsDataURL(file);
        }

            // Simpan instan di frontend (Anti-Revert saat refresh)
            AppState.config = Object.assign(AppState.config || {}, cfg);

                sessionStorage.removeItem('tokotrack_cached_initial_data');

                    .withSuccessHandler(function (res) {

        function renderStokSalesTable() {
            var tbody = document.getElementById('table-stok-sales-body');
            var pInfo = document.getElementById('pagination-info-stokSales');
            var btnPrev = document.getElementById('btn-prev-stokSales');
            var btnNext = document.getElementById('btn-next-stokSales');
            var kpiDiminta = document.getElementById('kpi-stok-diminta');
            var kpiDisetujui = document.getElementById('kpi-stok-disetujui');
            var kpiTerjual = document.getElementById('kpi-stok-terjual');
            var kpiSisa = document.getElementById('kpi-stok-sisa');

            var data = AppState.stokSales || [];

            var totDiminta = 0;
            var totDisetujui = 0;
            var totTerjual = 0;
            var totSisa = 0;

            data.forEach(function (d) {
                totDiminta += (Number(d.qtyDiminta) || 0);
                totDisetujui += (Number(d.qtyDisetujui) || 0);
                totTerjual += (Number(d.qtyTerjual) || 0);
                totSisa += (Number(d.sisaStok) || 0);
            });

            if (kpiDiminta) kpiDiminta.innerText = totDiminta + ' Pcs';
            if (kpiDisetujui) kpiDisetujui.innerText = totDisetujui + ' Pcs';
            if (kpiTerjual) kpiTerjual.innerText = totTerjual + ' Pcs';
            if (kpiSisa) kpiSisa.innerText = totSisa + ' Pcs';

            if (!tbody) return;

            var p = processTableData(data, 'stokSales');

            if (p.rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" class="p-8 text-center text-slate-400">Belum ada catatan permintaan stok yang cocok.</td></tr>';
            } else {
                var userRole = AppState.currentUser ? AppState.currentUser.role : 'Sales';

                tbody.innerHTML = p.rows.map(function (d) {
                    var isPending = d.status === 'Pending';
                    var isApproved = d.status === 'Disetujui';
                    var isClosed = d.status === 'Selesai';

                    var badgeClass = isPending ? 'bg-amber-100 text-amber-700 border-amber-200' : (isApproved ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-slate-100 text-slate-600 border-slate-200');

                        ? '<input type="checkbox" class="stok-item-checkbox w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 cursor-pointer" value="' + d.idPermintaan + '" onchange="handleStokItemCheck(\'' + d.idPermintaan + '\', this.checked)" ' + (isSelected ? 'checked' : '') + '>'
                        : '<span class="text-slate-300">-</span>';

                    var actionBtn = '';
                    if (userRole !== 'Sales') {
                        if (isPending) {

                    return '<tr class="hover:bg-slate-50 transition-colors">' +

        function addRequestStokRow(selectedKode, initialQty) {
            var container = document.getElementById('request-stok-items-container');
            if (!container) return;

            var row = document.createElement('div');
            row.className = 'flex items-center gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200';

        function handleSimpanRequestStok(e) {
            if (e) e.preventDefault();
            var dateVal = (document.getElementById('req-stok-tanggal') && document.getElementById('req-stok-tanggal').value) ? document.getElementById('req-stok-tanggal').value : getTodayDateString();
            var catatanVal = document.getElementById('req-stok-catatan') ? document.getElementById('req-stok-catatan').value : '';

            var rows = document.querySelectorAll('#request-stok-items-container > div');
            var items = [];
            rows.forEach(function (r) {
                var selectEl = r.querySelector('.req-item-select');
                var qtyEl = r.querySelector('.req-item-qty');
                if (selectEl && qtyEl) {
                    var kode = selectEl.value;
                    var qty = Number(qtyEl.value) || 1;
                    var prod = (AppState.produk || []).find(function (p) { return p['Kode Produk'] === kode; });
                    if (prod) {
                        items.push({
                            kodeProduk: prod['Kode Produk'],
                            namaProduk: prod['Nama Produk'],
                            satuan: prod['Satuan'] || 'Pcs',
                            qty: qty
                        });
                    }
                }
            });

            if (items.length === 0) {
                showToast('warning', 'Pilih minimal 1 produk!');
                return;
            }

            closeModal('modal-request-stok');
            showLoading('Mengirim permintaan stok bawaan...');

            var userRole = AppState.currentUser ? AppState.currentUser.role : 'Sales';
            var salesId = (AppState.currentUser && AppState.currentUser.userId) ? AppState.currentUser.userId : 'USR-003';
            var salesSelect = document.getElementById('req-stok-sales-id');
            if (userRole !== 'Sales' && salesSelect && salesSelect.value) {
                salesId = salesSelect.value;
            }

            var payload = {
                salesId: salesId,
                tanggal: dateVal,
                catatan: catatanVal,
                items: items
            };

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function (res) {
                        hideLoading();
                        if (res && res.success) {
                            showToast('success', res.message);
                            loadStokSalesHarian();
                        } else {
                            showToast('error', (res && res.message) || 'Gagal mengajukan stok');
                        }
                    })
                    .withFailureHandler(function (err) {
                        hideLoading();
                        showToast('error', err.message || 'Gagal mengajukan stok');
                    })
                    .apiCall('submitRequestStokSales', payload);
            } else {
                hideLoading();
                showToast('error', 'Koneksi ke Google Sheets tidak tersedia.');
            }
        }

        function openModalBulkApproveStok(targetSalesId, specificIds) {
            var data = AppState.stokSales || [];

            var pendingItems = data.filter(function (d) {
                var isPend = String(d.status || d.Status || '').toLowerCase() === 'pending';
                if (!isPend) return false;
                if (targetSalesId && String(d.salesId || d['ID Sales']).trim() !== String(targetSalesId).trim()) return false;
                if (specificIds && specificIds.length > 0 && specificIds.indexOf(d.idPermintaan || d['ID Permintaan']) === -1) return false;
                return true;
            });

            if (pendingItems.length === 0) {
                showToast('info', 'Tidak ada permintaan stok berstatus Pending pada filter ini (Semua sudah disetujui).');
                return;
            }

            var titleEl = document.getElementById('modal-bulk-stok-title');
            var subEl = document.getElementById('modal-bulk-stok-subtitle');
            if (targetSalesId) {
                var sObj = (AppState.users || []).find(function (u) { return u['User ID'] === targetSalesId; });
                var sName = sObj ? sObj['Nama Lengkap'] : (pendingItems[0].salesName || 'Sales');
                if (titleEl) titleEl.innerText = 'Persetujuan Stok: ' + sName;
                if (subEl) subEl.innerText = 'Centang produk yang disetujui untuk ' + sName + '.';
            } else {
                if (titleEl) titleEl.innerText = 'Persetujuan Daftar Stok Sales';
                if (subEl) subEl.innerText = 'Periksa dan centang produk yang disetujui untuk dibawa kanvas.';
            }

            AppState.modalBulkItems = pendingItems.map(function (d) {
                return {
                    idPermintaan: d.idPermintaan || d['ID Permintaan'],
                    salesId: d.salesId || d['ID Sales'],
                    salesName: d.salesName || d['Nama Sales'] || '-',
                    kodeProduk: d.kodeProduk || d['Kode Produk'] || '-',
                    namaProduk: d.namaProduk || d['Nama Produk'] || '-',
                    satuan: d.satuan || d['Satuan'] || 'Pcs',
                    qtyDiminta: Number(d.qtyDiminta || d['Qty Diminta']) || 0,
                    qtyDisetujui: Number(d.qtyDiminta || d['Qty Diminta']) || 0,
                    tanggal: d.tanggal || d['Tanggal'] || '-',
                    waktuRequest: d.waktuRequest || d['Waktu Request'] || '',
                    checked: true
                };
            });

            renderModalBulkItems();
            openModal('modal-bulk-approve-stok');
        }

        function renderModalBulkItems() {
            var container = document.getElementById('modal-bulk-stok-items-container');

            if (items.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs font-semibold">Tidak ada item pending yang dipilih.</div>';
                updateModalBulkSummary();
                return;
            }

            container.innerHTML = items.map(function (item) {
                var isChecked = item.checked !== false;
                var bgClass = isChecked ? 'bg-indigo-50/40 border-indigo-200' : 'bg-slate-50/70 border-slate-200 opacity-60';

                return '<div class="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 rounded-2xl border transition-all gap-3 ' + bgClass + '" id="modal-bulk-row-' + item.idPermintaan + '">' +
                    '<div class="flex items-start gap-3 flex-1 min-w-0">' +
                    '<input type="checkbox" class="modal-stok-item-cb w-4 h-4 mt-0.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 cursor-pointer" ' + (isChecked ? 'checked' : '') + ' onchange="handleModalItemCheck(\'' + item.idPermintaan + '\', this.checked)">' +
                    '<div class="min-w-0 flex-1">' +
                    '<div class="flex items-center gap-2 flex-wrap">' +

                    '</div>' +
                    '</div>' +
                    '<div class="flex items-center justify-end gap-2 shrink-0">' +
                    '<span class="text-[11px] text-slate-500 font-semibold">ACC Qty:</span>' +
                    '<input type="number" min="0" value="' + item.qtyDisetujui + '" oninput="handleModalItemQtyChange(\'' + item.idPermintaan + '\', this.value)" class="w-16 h-8 text-center bg-white border border-slate-300 rounded-lg text-xs font-extrabold text-indigo-700 focus:ring-1 focus:ring-indigo-500 focus:outline-none" ' + (!isChecked ? 'disabled' : '') + '>' +

            checkedItems.forEach(function (it) { totalPcs += (Number(it.qtyDisetujui) || 0); });

            if (btnSubmit) btnSubmit.disabled = (checkedItems.length === 0);

                cb.checked = checked;
                var idx = AppState.selectedStokIds.indexOf(val);

                    AppState.selectedStokIds.push(val);

            var bar = document.getElementById('bulk-stok-action-bar');
            var countLabel = document.getElementById('bulk-stok-selected-count');
            var btnText = document.getElementById('btn-text-approve-selected');
            var checkAll = document.getElementById('check-all-stok-sales');

            if (bar) {
                if (count > 0) {
                    bar.classList.remove('hidden');

                    bar.classList.add('hidden');

            }

            if (countLabel) countLabel.innerText = count + ' item dipilih';

                var checkboxes = document.querySelectorAll('.stok-item-checkbox');

                    checkboxes.forEach(function (cb) {

                } else {

                if (tab === 'SELFIE') {
                    if (btnSelfie) btnSelfie.className = activeClass;
                    if (singleImg) singleImg.src = AppStateActiveGallery.selfie;
                    if (singleCaption) singleCaption.innerText = 'Foto 1: Selfie Sales di Toko (' + AppStateActiveGallery.outlet + ')';
                    if (singleLink) singleLink.href = AppStateActiveGallery.selfie;
                } else if (tab === 'BARANG') {
                    if (btnBarang) btnBarang.className = activeClass;
                    if (singleImg) singleImg.src = AppStateActiveGallery.barang;
                    if (singleCaption) singleCaption.innerText = 'Foto 2: Ambil / Serah Terima Barang (' + AppStateActiveGallery.outlet + ')';
                    if (singleLink) singleLink.href = AppStateActiveGallery.barang;
                } else if (tab === 'DISPLAY') {
                    if (btnDisplay) btnDisplay.className = activeClass;
                    if (singleImg) singleImg.src = AppStateActiveGallery.display;
                    if (singleCaption) singleCaption.innerText = 'Foto 3: Display / Etalase Toko (' + AppStateActiveGallery.outlet + ')';
                    if (singleLink) singleLink.href = AppStateActiveGallery.display;
                }
            }
        }

        function openLightbox(imgUrl, title) {
            var titleEl = document.getElementById('lightbox-title');
            var subEl = document.getElementById('lightbox-subtitle');
            var tabsEl = document.getElementById('lightbox-tabs');
            var gridView = document.getElementById('lightbox-grid-view');
            var singleView = document.getElementById('lightbox-single-view');
            var singleImg = document.getElementById('lightbox-img');
            var singleCaption = document.getElementById('lightbox-single-caption');
            var singleLink = document.getElementById('lightbox-single-link');

            if (titleEl) titleEl.innerHTML = '<i class="fa-solid fa-image text-indigo-400"></i><span>Foto: ' + (title || 'Bukti') + '</span>';
            if (subEl) subEl.innerText = 'Tampilan foto bukti';
            if (tabsEl) tabsEl.classList.add('hidden');
            if (gridView) gridView.classList.add('hidden');

            var cdnUrl = formatDriveToLh3Url(imgUrl);
            if (singleImg) singleImg.src = cdnUrl;
            if (singleCaption) singleCaption.innerText = title || 'Foto Bukti';
            if (singleLink) singleLink.href = cdnUrl;
            if (singleView) singleView.classList.remove('hidden');

            openModal('modal-lightbox');
        }

        function openModal(id) {
            var el = document.getElementById(id);
            if (el) el.classList.remove('hidden');
        }

        function closeModal(id) {
            var el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        }

        function getTodayDateString() {
            var now = new Date();
            var y = now.getFullYear();
            var m = String(now.getMonth() + 1).padStart(2, '0');
            var d = String(now.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function getCurrentTimeString() {
            var now = new Date();
            var hh = String(now.getHours()).padStart(2, '0');
            var mm = String(now.getMinutes()).padStart(2, '0');
            var ss = String(now.getSeconds()).padStart(2, '0');
            return hh + ':' + mm + ':' + ss;
        }

        var loadingTimeoutTimer = null;
        var loadingCancelBtnTimer = null;

        function showLoading(msg, maxWaitSeconds) {
            clearTimeout(loadingTimeoutTimer);
            clearTimeout(loadingCancelBtnTimer);

            var overlay = document.getElementById('loading-overlay');
            var txt = document.getElementById('loading-text');
            var subtxt = document.getElementById('loading-subtext');
            var btnCancel = document.getElementById('btn-cancel-loading');

            if (txt) txt.innerText = msg || 'Memproses data...';
            if (subtxt) subtxt.innerText = 'Mohon tunggu sebentar...';
            if (btnCancel) btnCancel.classList.add('hidden');
            if (overlay) overlay.classList.remove('hidden');

            // Munculkan tombol batal jika proses sudah berjalan > 10 detik
            loadingCancelBtnTimer = setTimeout(function () {
                if (btnCancel && overlay && !overlay.classList.contains('hidden')) {
                    btnCancel.classList.remove('hidden');
                    if (subtxt) subtxt.innerText = 'Koneksi lambat. Anda dapat menunggu atau membatalkan.';
                }
            }, 10000);

            // Timeout otomatis maks 35 detik (mencegah spinner macet selamanya 15+ menit!)
            var waitMs = (maxWaitSeconds || 35) * 1000;
            loadingTimeoutTimer = setTimeout(function () {
                if (overlay && !overlay.classList.contains('hidden')) {
                    hideLoading();
                    showToast('warning', 'Waktu proses habis (sinyal jaringan lemah). Silakan coba kirim kembali.');
                }
            }, waitMs);
        }

        function hideLoading() {
            clearTimeout(loadingTimeoutTimer);
            clearTimeout(loadingCancelBtnTimer);
            var overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function cancelLoadingForce() {
            hideLoading();
            showToast('info', 'Proses dibatalkan oleh pengguna.');
        }

        function showToast(type, msg) {
            var container = document.getElementById('toast-container');
            if (!container) return;
            var toast = document.createElement('div');
            var bg = 'bg-slate-900 text-white';
            var icon = 'fa-info-circle text-sky-400';
            if (type === 'success') { bg = 'bg-slate-900 text-white'; icon = 'fa-check-circle text-emerald-400'; }
            if (type === 'error') { bg = 'bg-rose-900 text-white'; icon = 'fa-triangle-exclamation text-rose-300'; }
            if (type === 'warning') { bg = 'bg-amber-900 text-white'; icon = 'fa-circle-exclamation text-amber-300'; }
            toast.className = bg + ' p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-semibold pointer-events-auto transition-all transform duration-300 translate-y-2 opacity-0 border border-white/10';
            toast.innerHTML = '<i class="fa-solid ' + icon + ' text-base shrink-0"></i><span>' + msg + '</span>';
            container.appendChild(toast);
            setTimeout(function () { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(function () {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(function () { toast.remove(); }, 300);
            }, 3500);
        }

        // DOM Ready Event
        document.addEventListener('DOMContentLoaded', function () {
            initGPS();
            applyBranding();
            loadPublicBranding();

            function isAnyOverlayOrDropdownOpen() {
                var notifMenu = document.getElementById('notification-dropdown-menu');
                if (notifMenu && !notifMenu.classList.contains('hidden') && notifMenu.style.display !== 'none') {
                    return true;
                }
                var profMenu = document.getElementById('profile-dropdown-menu');
                if (profMenu && !profMenu.classList.contains('hidden') && profMenu.style.display !== 'none') {
                    return true;
                }
                var drawer = document.getElementById('drawer-lainnya');
                if (drawer && !drawer.classList.contains('hidden')) {
                    return true;
                }
                return false;
            }

            // Sinkronisasi status scroll ke Native Android: Matikan Swipe-to-Refresh secara permanen
            // agar APK lama (v1.0.2) yang sudah terinstall di HP klien otomatis terupdate tanpa perlu install ulang!
            function syncScrollToAndroid() {
                try {
                    if (window.AndroidBridge && typeof window.AndroidBridge.setCanRefresh === 'function') {
                        window.AndroidBridge.setCanRefresh(false);
                    }
                } catch (e) {}
            }

            window.addEventListener('scroll', syncScrollToAndroid, { passive: true });
            document.addEventListener('scroll', syncScrollToAndroid, { passive: true, capture: true });
            window.addEventListener('touchstart', syncScrollToAndroid, { passive: true });
            window.addEventListener('touchmove', syncScrollToAndroid, { passive: true, capture: true });
            var mainEl = document.querySelector('main');
            if (mainEl) {
                mainEl.addEventListener('scroll', syncScrollToAndroid, { passive: true });
            }
            setInterval(syncScrollToAndroid, 400);
            syncScrollToAndroid();

            var ndMenu = document.getElementById('notification-dropdown-menu');
            if (ndMenu) {
                ndMenu.addEventListener('touchstart', function () {
                    if (window.AndroidBridge && typeof window.AndroidBridge.setCanRefresh === 'function') {
                        window.AndroidBridge.setCanRefresh(false);
                    }
                }, { passive: true });
                ndMenu.addEventListener('touchmove', function (e) {
                    if (window.AndroidBridge && typeof window.AndroidBridge.setCanRefresh === 'function') {
                        window.AndroidBridge.setCanRefresh(false);
                    }
                    e.stopPropagation();
                }, { passive: true });
            }

            document.addEventListener('click', function (e) {
                var dd = document.getElementById('profile-dropdown-menu');
                if (dd && !e.target.closest('#profile-dropdown-menu') && !e.target.closest('button[onclick*="toggleProfileDropdown"]')) {
                    dd.classList.add('hidden');
                    dd.style.display = 'none';
                    syncScrollToAndroid();
                }

                var nd = document.getElementById('notification-dropdown-menu');
                if (nd && !e.target.closest('#notification-dropdown-menu') && !e.target.closest('#btn-notification-bell') && !e.target.closest('button[onclick*="toggleNotificationDropdown"]')) {
                    nd.classList.add('hidden');
                    nd.style.display = 'none';
                    syncScrollToAndroid();
                }
            });

            var saved = localStorage.getItem('tokotrack_session');
            if (saved) {
                try {
                    AppState.currentUser = JSON.parse(saved);
                    syncUserPushNotificationTopic();
                    showAppShell();
                    loadInitialData();
                } catch (e) {
                    localStorage.removeItem('tokotrack_session');
                }
            }
        });
    </script>
</head>
