<!-- =============================================================== -->
<!-- TAB: MASTER WILAYAH (Admin & Owner Only) -->
<!-- =============================================================== -->
<section id="tab-wilayah" class="tab-content hidden space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
            <h2 class="text-base font-extrabold text-slate-900">Master Wilayah / Area</h2>
            <p class="text-xs text-slate-500">Kelola wilayah kabupaten/kota penugasan sales.</p>
        </div>
        <button id="btn-tambah-wilayah" onclick="openModalTambahWilayah()"
            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-xs font-bold shadow-md shadow-indigo-600/30 flex items-center gap-2 w-fit">
            <i class="fa-solid fa-plus"></i>
            <span>Tambah Wilayah</span>
        </button>
    </div>

    <!-- Controls: Refresh, Search -->
    <div
        class="bg-white p-4 rounded-3xl border border-slate-200 shadow-xs flex flex-col sm:flex-row gap-3 items-center justify-between">
        <div class="w-full sm:w-80 relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" onkeyup="setTableSearch('wilayah', this.value)"
                placeholder="Cari nama kabupaten / kode wilayah..."
                class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
            <button onclick="loadInitialData()"
                class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-rotate"></i>
                <span>Refresh</span>
            </button>
        </div>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-50/80 text-slate-500 font-bold border-b border-slate-100">
                    <tr>
                        <th onclick="changeTableSort('wilayah', 'Kode Wilayah')" class="sortable-th p-4">Kode <i
                                class="fa-solid fa-sort ml-1 text-slate-400"></i></th>
                        <th onclick="changeTableSort('wilayah', 'Nama Wilayah')" class="sortable-th p-4">Wilayah & Area
                            <i class="fa-solid fa-sort ml-1 text-slate-400"></i></th>
                        <th class="p-4">Lokasi Absen Kantor</th>
                        <th class="p-4">Setup Pembayaran</th>
                        <th class="p-4">Cakupan Area</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-wilayah-body" class="divide-y divide-slate-100 text-slate-700">
                </tbody>
            </table>
        </div>

        <!-- Pagination Controls -->
        <div class="p-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
            <span id="pagination-info-wilayah" class="text-slate-500 font-medium">Menampilkan 0
                data</span>
            <div class="flex items-center gap-2">
                <button id="btn-prev-wilayah" onclick="changeTablePage('wilayah', -1)"
                    class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed font-bold rounded-xl text-slate-700">
                    <i class="fa-solid fa-chevron-left mr-1"></i> Sebelumnya
                </button>
                <button id="btn-next-wilayah" onclick="changeTablePage('wilayah', 1)"
                    class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed font-bold rounded-xl text-slate-700">
                    Selanjutnya <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>
</section>
